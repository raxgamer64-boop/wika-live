name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore and Base64
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -storepass wika123 \
            -alias wika \
            -keypass wika123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=WikaLive, OU=Mobile, O=Wika, L=Delhi, S=Delhi, C=IN"
          
          base64 -w 0 release-key.jks > base64.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore-and-base64
          path: |
            release-key.jks
            base64.txt
