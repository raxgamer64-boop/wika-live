name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          test -f main.dart
          cp main.dart app/lib/main.dart

          echo "Flutter project created."


      # ==========================================
      # 4. CONFIGURE FIREBASE + ANDROID
      # ==========================================
      - name: Configure Firebase and Android
        working-directory: app
        run: |
          set -e

          cp ../google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path
          import re

          # --------------------------------------
          # settings.gradle.kts
          # --------------------------------------
          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false
          """,
                  1
              )

          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false',
              text,
              count=1
          )

          settings.write_text(text)

          # --------------------------------------
          # app/build.gradle.kts
          # --------------------------------------
          build = Path("android/app/build.gradle.kts")
          text = build.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services")
          """,
                  1
              )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          # --------------------------------------
          # Release signing
          # --------------------------------------
          if 'create("wikaliveRelease")' not in text:
              signing = r'''
          signingConfigs {
              create("wikaliveRelease") {
                  storeFile = file("upload-keystore.jks")
                  storePassword =
                      providers.gradleProperty("storePassword").orNull
                  keyAlias =
                      providers.gradleProperty("keyAlias").orNull
                  keyPassword =
                      providers.gradleProperty("keyPassword").orNull
              }
          }
          '''

              text = text.replace(
                  "buildTypes {",
                  signing + "\nbuildTypes {",
                  1
              )

          if 'signingConfig = signingConfigs.getByName("wikaliveRelease")' not in text:
              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("wikaliveRelease")""",
                  1
              )

          # --------------------------------------
          # Kotlin JVM 17
          # --------------------------------------
          if "jvmTarget.set(" not in text:
              text += '''
          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          '''

          build.write_text(text)

          # --------------------------------------
          # gradle.properties
          # --------------------------------------
          gp = Path("android/gradle.properties")
          existing = gp.read_text() if gp.exists() else ""

          def set_property(content, key, value):
              lines = content.splitlines()
              found = False
              output = []

              for line in lines:
                  if line.startswith(key + "="):
                      if not found:
                          output.append(key + "=" + value)
                          found = True
                  else:
                      output.append(line)

              if not found:
                  output.append(key + "=" + value)

              return "\n".join(output) + "\n"

          existing = set_property(
              existing,
              "org.gradle.jvmargs",
              "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          )

          existing = set_property(
              existing,
              "org.gradle.daemon",
              "false"
          )

          existing = set_property(
              existing,
              "org.gradle.parallel",
              "false"
          )

          existing = set_property(
              existing,
              "org.gradle.caching",
              "false"
          )

          existing = set_property(
              existing,
              "android.useAndroidX",
              "true"
          )

          existing = set_property(
              existing,
              "android.enableJetifier",
              "true"
          )

          gp.write_text(existing)
          PY

          # --------------------------------------
          # Android permissions
          # --------------------------------------
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "\n    <application",
                      "\n" + permission + "\n    <application",
                      1
                  )

          p.write_text(text)
          PY

          test -f android/app/google-services.json


      # ==========================================
      # 5. FIX ZEGO API REFERENCES
      # ==========================================
      - name: Fix ZEGO API compatibility
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("lib/main.dart")
          text = p.read_text()

          # Remove unsupported controller constructor parameters.
          text = text.replace(
              '    controller: ZegoUIKitPrebuiltLiveStreamingController(),\n',
              ''
          )

          text = text.replace(
              '      controller: ZegoUIKitPrebuiltLiveStreamingController(),\n',
              ''
          )

          # Microphone/camera switch API.
          text = text.replace(
              'ZegoUIKitPrebuiltLiveStreamingController().microphone.toggle()',
              'ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.switchState()'
          )

          text = text.replace(
              'ZegoUIKitPrebuiltLiveStreamingController().camera.toggle()',
              'ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.switchState()'
          )

          text = text.replace(
              'controller.microphone.toggle()',
              'controller.audioVideo.microphone.switchState()'
          )

          text = text.replace(
              'controller.camera.toggle()',
              'controller.audioVideo.camera.switchState()'
          )

          text = text.replace(
              'u.isCameraOn || u.isMicrophoneOn',
              'u.camera.value || u.microphone.value'
          )

          text = re.sub(
              r'ZegoUIKitPrebuiltLiveStreamingController\(\)\s*\.\s*microphone(?:\s*\.\s*value)?',
              'ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.localState',
              text
          )

          text = re.sub(
              r'ZegoUIKitPrebuiltLiveStreamingController\(\)\s*\.\s*camera(?:\s*\.\s*value)?',
              'ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.localState',
              text
          )

          text = re.sub(
              r'(?<![A-Za-z0-9_])controller\s*\.\s*microphone(?:\s*\.\s*value)?',
              'controller.audioVideo.microphone.localState',
              text
          )

          text = re.sub(
              r'(?<![A-Za-z0-9_])controller\s*\.\s*camera(?:\s*\.\s*value)?',
              'controller.audioVideo.camera.localState',
              text
          )

          p.write_text(text)
          PY

          if grep -qE "isCameraOn|isMicrophoneOn" lib/main.dart; then
            echo "ERROR: obsolete ZEGO camera/microphone fields remain."
            exit 1
          fi

          echo "ZEGO compatibility check completed."


      # ==========================================
      # 6. ADD REQUIRED PACKAGES
      # ==========================================
      - name: Add packages
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          flutter pub get


      # ==========================================
      # 7. VERIFY FIREBASE
      # ==========================================
      - name: Verify Firebase
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(path, "r") as f:
              data = json.load(f)

          project_id = data.get("project_info", {}).get("project_id")

          if project_id != "wika-live":
              raise SystemExit(
                  f"ERROR: Wrong Firebase project: {project_id}"
              )

          package_found = False
          web_client_found = False

          for client in data.get("client", []):
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == "com.example.wika_live":
                  package_found = True

                  for oauth in client.get("oauth_client", []):
                      if oauth.get("client_type") == 3:
                          web_client_found = True

          if not package_found:
              raise SystemExit(
                  "ERROR: com.example.wika_live missing from Firebase JSON"
              )

          if not web_client_found:
              raise SystemExit(
                  "ERROR: Web OAuth client missing from Firebase JSON"
              )

          print("Firebase project: OK")
          print("Android package: OK")
          print("Web OAuth client: OK")
          PY


      # ==========================================
      # 8. CONFIGURE RELEASE KEYSTORE
      # ==========================================
      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$STORE_PASS" ]; then
            echo "ERROR: KEYSTORE_PASS is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" \
            -v | grep -E "Alias name:|Entry type:|SHA1:"

          echo "Release signing ready."


      # ==========================================
      # 9. ANALYZE
      # ==========================================
      - name: Analyze Dart
        working-directory: app
        run: |
          set -e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings


      # ==========================================
      # 10. BUILD RELEASE APK
      # ==========================================
      - name: Build release APK
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASS }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo "ERROR: ZEGO_APP_SIGN is missing."
            exit 1
          fi

          flutter clean
          flutter pub get

          echo "=========================================="
          echo "BUILDING WIKALIVE RELEASE APK"
          echo "=========================================="

          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK CREATED:"
          ls -lh "$APK"


      # ==========================================
      # 11. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
