name: Build WikaLive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        run: |
          set -e

          flutter create --project-name wika_live app

          cp main.dart app/lib/main.dart
          cp google-services.json app/android/app/google-services.json

          echo "======================================"
          echo "FLUTTER PROJECT CREATED"
          echo "======================================"

          test -f app/lib/main.dart
          test -f app/android/app/google-services.json

          echo "main.dart FOUND"
          echo "google-services.json FOUND"


      # ==========================================
      # 4. CONFIGURE FIREBASE
      # ==========================================
      - name: Configure Firebase Google Services
        run: |
          set -e

          cd app

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          build = Path("android/app/build.gradle.kts")

          # --------------------------------------
          # settings.gradle.kts
          # --------------------------------------
          text = settings.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services") version "4.5.0" apply false''',
                  1
              )

          settings.write_text(text)

          # --------------------------------------
          # app/build.gradle.kts
          # --------------------------------------
          text = build.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services")''',
                  1
              )

          build.write_text(text)

          print("Firebase Google Services configured.")
          PY

          echo "======================================"
          echo "CHECK GOOGLE SERVICES JSON"
          echo "======================================"

          test -f android/app/google-services.json

          echo "google-services.json FOUND"


      # ==========================================
      # 5. GET PACKAGES
      # ==========================================
      - name: Get packages
        run: |
          set -e

          cd app

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add google_sign_in:6.3.0

          flutter pub get


      # ==========================================
      # 6. VERIFY FIREBASE JSON
      # ==========================================
      - name: Verify Firebase JSON
        run: |
          set -e

          echo "======================================"
          echo "FIREBASE JSON CHECK"
          echo "======================================"

          python3 - <<'PY'
          import json

          path = "app/android/app/google-services.json"

          with open(path, "r") as f:
              data = json.load(f)

          project_id = data["project_info"]["project_id"]
          project_number = data["project_info"]["project_number"]

          print("Project ID:", project_id)
          print("Project Number:", project_number)

          found = False

          for client in data.get("client", []):

              package = client.get(
                  "client_info",
                  {}
              ).get(
                  "android_client_info",
                  {}
              ).get(
                  "package_name"
              )

              if package == "com.example.wika_live":

                  found = True

                  print("PACKAGE: com.example.wika_live")

                  for oauth in client.get("oauth_client", []):

                      print(
                          "OAuth Type:",
                          oauth.get("client_type")
                      )

                      print(
                          "OAuth Client ID:",
                          oauth.get("client_id")
                      )

                      android_info = oauth.get(
                          "android_info",
                          {}
                      )

                      certificate = android_info.get(
                          "certificate_hash"
                      )

                      if certificate:
                          print(
                              "Certificate SHA-1:",
                              certificate
                          )

          if not found:
              raise SystemExit(
                  "ERROR: com.example.wika_live was not found in google-services.json"
              )

          print("Firebase JSON verification successful.")
          PY


      # ==========================================
      # 7. CHECK FLUTTER PROJECT
      # ==========================================
      - name: Check Flutter project
        run: |
          set -e

          cd app

          flutter analyze || true


      # ==========================================
      # 8. SETUP RELEASE KEYSTORE
      # ==========================================
      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "======================================"
          echo "SETTING UP RELEASE KEYSTORE"
          echo "======================================"

          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks

          test -s app/android/app/upload-keystore.jks

          echo "Release keystore file created successfully."


      # ==========================================
      # 9. VERIFY KEYSTORE
      # ==========================================
  


      # ==========================================
      # 10. GET RELEASE KEY SHA
      # ==========================================
      - name: Get release keystore SHA
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          echo "======================================"
          echo "RELEASE KEYSTORE SHA FINGERPRINTS"
          echo "======================================"

          keytool -list -v \
            -keystore app/android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASS" \
            -alias "$KEY_ALIAS" \
            | grep -E "SHA1:|SHA256:"


      # ==========================================
      # 11. CONFIGURE RELEASE SIGNING
      # ==========================================
      - name: Configure release signing
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/android/app/build.gradle.kts")

          text = p.read_text()

          # --------------------------------------
          # Add signingConfigs inside android {}
          # --------------------------------------
          if 'create("release")' not in text:

              signing_config = '''
              signingConfigs {
                  create("release") {
                      storeFile = file("upload-keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASS")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              '''

              text = text.replace(
                  "android {",
                  "android {" + signing_config,
                  1
              )

          # --------------------------------------
          # Replace Flutter default debug signing
          # --------------------------------------
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          # --------------------------------------
          # If release signing isn't present,
          # add it to existing release block
          # --------------------------------------
          if 'signingConfig = signingConfigs.getByName("release")' not in text:

              text = text.replace(
                  'release {',
                  '''release {
                      signingConfig = signingConfigs.getByName("release")''',
                  1
              )

          p.write_text(text)

          print("======================================")
          print("RELEASE SIGNING CONFIGURED")
          print("======================================")
          PY


      # ==========================================
      # 12. BUILD RELEASE APK
      # ==========================================
      - name: Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd app

          flutter clean
          flutter pub get

          echo "======================================"
          echo "BUILDING RELEASE APK"
          echo "======================================"

          flutter build apk --release

          echo "======================================"
          echo "RELEASE APK BUILD COMPLETED"
          echo "======================================"


      # ==========================================
      # 13. VERIFY FIREBASE GENERATED RESOURCES
      # ==========================================
      - name: Verify Firebase generated resources
        run: |
          set -e

          echo "======================================"
          echo "FIREBASE GENERATED RESOURCES"
          echo "======================================"

          find app/build \
            -type f \
            -path "*google-services*" \
            -print

          echo "======================================"
          echo "CHECK default_web_client_id"
          echo "======================================"

          grep -R \
            "default_web_client_id" \
            app/build \
            2>/dev/null || true

          echo "======================================"
          echo "CHECK google_app_id"
          echo "======================================"

          grep -R \
            "google_app_id" \
            app/build \
            2>/dev/null || true


      # ==========================================
      # 14. VERIFY APK
      # ==========================================
      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "WIKALIVE APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"


      # ==========================================
      # 15. GET FINAL APK SHA
      # ==========================================
      - name: Get APK SHA fingerprints
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          APKS
