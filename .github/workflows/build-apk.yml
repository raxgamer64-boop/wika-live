name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          # Use the repository's real root main.dart. Patch the ZEGO API mismatches
          # in-place so the build never depends on a second filename being uploaded.
          test -f main.dart || { echo 'ERROR: root main.dart is missing'; exit 1; }
          cp main.dart app/lib/main.dart
          mkdir -p app/assets

          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('app/lib/main.dart')
          text = p.read_text()

          # Current ZEGO prebuilt live-streaming widget does not expose a
          # controller named parameter. Remove only the controller argument
          # lines introduced by the previous UI version.
          text = text.replace(
              '    controller: ZegoUIKitPrebuiltLiveStreamingController(),\n',
              ''
          )
          text = text.replace(
              '      controller: ZegoUIKitPrebuiltLiveStreamingController(),\n',
              ''
          )

          # ZEGO 3.15.6: local mic/camera state is exposed by
          # controller.audioVideo.microphone.localState / camera.localState.
          # Fix both the singleton form and the common local `controller`
          # variable form so the committed main.dart cannot leave the old
          # direct getters behind.
          import re

          # ZEGO 3.15.6: switchState() is the supported way to toggle
          # the local microphone/camera. Do this BEFORE the localState
          # getter replacements below, otherwise a bool would receive
          # an invalid .toggle() call.
          text = text.replace(
              'ZegoUIKitPrebuiltLiveStreamingController().microphone.toggle()',
              'ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.switchState()',
          )
          text = text.replace(
              'ZegoUIKitPrebuiltLiveStreamingController().camera.toggle()',
              'ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.switchState()',
          )
          text = text.replace(
              'controller.microphone.toggle()',
              'controller.audioVideo.microphone.switchState()',
          )
          text = text.replace(
              'controller.camera.toggle()',
              'controller.audioVideo.camera.switchState()',
          )

          text = text.replace(
              'u.isCameraOn || u.isMicrophoneOn',
              'u.camera.value || u.microphone.value'
          )

          text = re.sub(
              r'ZegoUIKitPrebuiltLiveStreamingController\(\)\s*\.\s*microphone(?:\s*\.\s*value)?',
              'ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.localState',
              text,
          )
          text = re.sub(
              r'ZegoUIKitPrebuiltLiveStreamingController\(\)\s*\.\s*camera(?:\s*\.\s*value)?',
              'ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.localState',
              text,
          )

          text = re.sub(
              r'(?<![A-Za-z0-9_])controller\s*\.\s*microphone(?:\s*\.\s*value)?',
              'controller.audioVideo.microphone.localState',
              text,
          )
          text = re.sub(
              r'(?<![A-Za-z0-9_])controller\s*\.\s*camera(?:\s*\.\s*value)?',
              'controller.audioVideo.camera.localState',
              text,
          )

          p.write_text(text)
          PYFIX

          echo '--- ZEGO compile-fix verification ---'
          echo 'Remaining direct ZEGO getter references (must be empty):'
          grep -nE "ZegoUIKitPrebuiltLiveStreamingController\(\)[[:space:]]*\.[[:space:]]*(microphone|camera)" app/lib/main.dart || true
          grep -nE "(^|[^A-Za-z0-9_])controller[[:space:]]*\.[[:space:]]*(microphone|camera)" app/lib/main.dart || true

          if grep -qE "ZegoUIKitPrebuiltLiveStreamingController\(\)[[:space:]]*\.[[:space:]]*(microphone|camera)" app/lib/main.dart; then
            echo 'ERROR: direct singleton microphone/camera getter remains.'
            exit 1
          fi
          if grep -qE "(^|[^A-Za-z0-9_])controller[[:space:]]*\.[[:space:]]*(microphone|camera)" app/lib/main.dart; then
            echo 'ERROR: direct controller microphone/camera getter remains.'
            exit 1
          fi
          if grep -qE "isCameraOn|isMicrophoneOn" app/lib/main.dart; then
            echo 'ERROR: obsolete ZegoUIKitUser camera/microphone fields remain.'
            exit 1
          fi
          echo 'ZEGO compile fixes verified.'
          cp google-services.json app/android/app/google-services.json

          # ==========================================
          # ANDROID RUNTIME PERMISSIONS
          # ==========================================
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          for perm in permissions:
              if perm not in text:
                  text = text.replace("\n    <application", "\n" + perm + "\n    <application", 1)
          p.write_text(text)
          PY


          test -f app/lib/main.dart
          test -f app/android/app/google-services.json

          echo "=========================================="
          echo "FLUTTER PROJECT CREATED"
          echo "=========================================="


      # ==========================================
      # 4. CONFIGURE FIREBASE + ANDROIDX
      # ==========================================
      - name: Configure Firebase and AndroidX
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # --------------------------------------
          # settings.gradle.kts
          # --------------------------------------

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false
          """,
                  1
              )

          # Keep Kotlin plugin compatible with current dependencies.
          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false',
              text,
              count=1
          )

          if "id(\"org.jetbrains.kotlin.android\")" not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false
          """,
                  1
              )

          settings.write_text(text)

          # --------------------------------------
          # app/build.gradle.kts
          # --------------------------------------

          build = Path("android/app/build.gradle.kts")
          text = build.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services")
          """,
                  1
              )

          # Remove old Kotlin syntax if present.
          text = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\}',
              '',
              text,
              flags=re.DOTALL
          )

          text = re.sub(
              r'\n\s*jvmTarget\s*=\s*JavaVersion\.VERSION_\d+\.toString\(\)',
              '',
              text
          )

          # Add Java 17 compile options if generated project has them.
          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          # --------------------------------------
          # Release signing configuration
          # --------------------------------------

          if 'create("wikaliveRelease")' not in text:

              signing = r'''
          signingConfigs {
              create("wikaliveRelease") {
                  storeFile = file("upload-keystore.jks")
                  storePassword =
                      providers.gradleProperty("storePassword").orNull
                  keyAlias =
                      providers.gradleProperty("keyAlias").orNull
                  keyPassword =
                      providers.gradleProperty("keyPassword").orNull
              }
          }
          '''

              text = text.replace(
                  "buildTypes {",
                  signing + "\nbuildTypes {",
                  1
              )

          # --------------------------------------
          # Attach signing to release build
          # --------------------------------------

          if 'signingConfig = signingConfigs.getByName("wikaliveRelease")' not in text:

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("wikaliveRelease")""",
                  1
              )

          # --------------------------------------
          # Kotlin compiler JVM 17
          # --------------------------------------

          if "jvmTarget.set(" not in text:

              text += '''

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          '''

          build.write_text(text)

          # --------------------------------------
          # gradle.properties
          # --------------------------------------

          gp = Path("android/gradle.properties")
          existing = gp.read_text() if gp.exists() else ""

          def set_property(content, key, value):
              lines = content.splitlines()
              found = False
              output = []

              for line in lines:
                  if line.startswith(key + "="):
                      if not found:
                          output.append(key + "=" + value)
                          found = True
                  else:
                      output.append(line)

              if not found:
                  output.append(key + "=" + value)

              return "\n".join(output) + "\n"

          existing = set_property(
              existing,
              "org.gradle.jvmargs",
              "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          )

          existing = set_property(
              existing,
              "org.gradle.daemon",
              "false"
          )

          existing = set_property(
              existing,
              "org.gradle.parallel",
              "false"
          )

          existing = set_property(
              existing,
              "org.gradle.caching",
              "false"
          )

          existing = set_property(
              existing,
              "android.useAndroidX",
              "true"
          )

          existing = set_property(
              existing,
              "android.enableJetifier",
              "true"
          )

          gp.write_text(existing)

          print("==========================================")
          print("ANDROID CONFIGURATION READY")
          print("==========================================")
          print("Google Services: ENABLED")
          print("Kotlin: 2.3.21")
          print("JVM: 17")
          print("AndroidX: ENABLED")
          print("Gradle memory: 4 GB")
          print("Release signing config: ENABLED")
          print("==========================================")
          PY


      # ==========================================
      # 5. ADD PACKAGES
      # ==========================================
      - name: Add packages
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          python3 - <<'PYASSET'
          from pathlib import Path
          p = Path('pubspec.yaml')
          lines = p.read_text().splitlines()

          # Remove any existing Flutter assets block first. This prevents
          # duplicate YAML keys if flutter create/package commands already
          # created an assets: section.
          cleaned = []
          i = 0
          while i < len(lines):
              if lines[i].strip() == 'assets:' and lines[i].startswith('  '):
                  i += 1
                  while i < len(lines):
                      line = lines[i]
                      if line and not line.startswith((' ', '\t')):
                          break
                      i += 1
                  continue
              cleaned.append(lines[i])
              i += 1

          lines = cleaned
          flutter_idx = next(
              i for i, line in enumerate(lines)
              if line.strip() == 'flutter:' and not line.startswith((' ', '\t'))
          )
          lines[flutter_idx + 1:flutter_idx + 1] = [
              '  assets:',
          ]

          p.write_text('\n'.join(lines) + '\n')
          PYASSET

          echo '--- FINAL PUBSPEC FLUTTER SECTION ---'
          sed -n '/^flutter:/,/^[^[:space:]]/p' pubspec.yaml | head -20

          flutter pub get


      # ==========================================
      # 6. VERIFY FIREBASE CONFIG
      # ==========================================
      - name: Verify Firebase configuration
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(path, "r") as f:
              data = json.load(f)

          project_id = data.get("project_info", {}).get("project_id")

          if project_id != "wika-live":
              raise SystemExit(
                  f"ERROR: Wrong Firebase project: {project_id}"
              )

          package_found = False
          web_client_found = False

          for client in data.get("client", []):

              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == "com.example.wika_live":
                  package_found = True

                  for oauth in client.get("oauth_client", []):
                      if oauth.get("client_type") == 3:
                          web_client_found = True

          if not package_found:
              raise SystemExit(
                  "ERROR: com.example.wika_live missing from Firebase JSON"
              )

          if not web_client_found:
              raise SystemExit(
                  "ERROR: Web OAuth client missing from Firebase JSON"
              )

          print("Firebase project: OK")
          print("Android package: OK")
          print("Web OAuth client: OK")
          PY


      # ==========================================
      # 7. CONFIGURE RELEASE KEYSTORE
      # ==========================================
      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$STORE_PASS" ]; then
            echo "ERROR: STORE_PASS is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "=========================================="
          echo "RELEASE KEYSTORE FOUND"
          echo "=========================================="

          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" \
            -v | grep -E "Alias name:|Entry type:|SHA1:"

          echo "=========================================="
          echo "RELEASE SIGNING READY"
          echo "=========================================="


      # ==========================================
      # 8. ANALYZE DART
      # ==========================================
      - name: Analyze Dart
        working-directory: app
        run: |
          set -e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings


      # ==========================================
      # 9. BUILD RELEASE APK
      # ==========================================
      - name: Build release APK
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}

          # Gradle automatically reads ORG_GRADLE_PROJECT_*
          # as Gradle project properties.
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASS }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo 'ERROR: ZEGO_APP_SIGN is missing.'
            exit 1
          fi

          flutter clean
          flutter pub get

          echo '=========================================='
          echo 'BUILDING WIKALIVE RELEASE APK'
          echo '=========================================='
          echo 'Flutter: 3.35.4'
          echo 'Kotlin: 2.3.21'
          echo 'JVM: 17'
          echo 'Google Sign-In: 7.2.0'

          flutter build apk --release

          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # ==========================================
      # 11. UPLOAD APK
      # ======================================          
