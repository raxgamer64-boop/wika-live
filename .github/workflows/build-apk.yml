name: Build WikaLive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          test -f main.dart
          test -f google-services.json

          cp main.dart app/lib/main.dart
          cp google-services.json app/android/app/google-services.json

          echo "Project files copied."

      - name: Configure Android
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ============================================
          # settings.gradle.kts
          # ============================================

          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          # Kotlin 2.3.21
          s = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false',
              s,
              count=1
          )

          if 'org.jetbrains.kotlin.android' not in s:
              s = s.replace(
                  "plugins {",
                  '''plugins {
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false''',
                  1
              )

          # Google Services
          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  "plugins {",
                  '''plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false''',
                  1
              )

          p.write_text(s)

          # ============================================
          # app/build.gradle.kts
          # ============================================

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Google Services plugin
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  '''plugins {
              id("com.google.gms.google-services")''',
                  1
              )

          # --------------------------------------------
          # Remove Flutter's old Kotlin jvmTarget
          # --------------------------------------------

          s = re.sub(
              r'\s*kotlinOptions\s*\{[^{}]*\}',
              '',
              s
          )

          s = re.sub(
              r'\s*jvmTarget\s*=\s*JavaVersion\.VERSION_\d+\.toString\(\)',
              '',
              s
          )

          # --------------------------------------------
          # Remove old compilerOptions if any
          # --------------------------------------------

          s = re.sub(
              r'\n\s*kotlin\s*\{\s*compilerOptions\s*\{.*?\}\s*\}',
              '',
              s,
              flags=re.DOTALL
          )

          # --------------------------------------------
          # Java 17
          # --------------------------------------------

          s = s.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          # --------------------------------------------
          # Release signing
          # NO Properties()
          # --------------------------------------------

          if 'create("release")' not in s:
              signing_block = '''

          signingConfigs {
              create("release") {
                  storeFile =
                      rootProject.file("upload-keystore.jks")

                  storePassword =
                      providers.gradleProperty("storePassword").orNull

                  keyAlias =
                      providers.gradleProperty("keyAlias").orNull

                  keyPassword =
                      providers.gradleProperty("keyPassword").orNull
              }
          }
          '''

              s = s.replace(
                  "buildTypes {",
                  signing_block + "\nbuildTypes {",
                  1
              )

          # --------------------------------------------
          # Release signing config
          # --------------------------------------------

          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace(
                  "release {",
                  '''release {
                      signingConfig =
                          signingConfigs.getByName("release")''',
                  1
              )

          # --------------------------------------------
          # Kotlin 2.3 compilerOptions
          # --------------------------------------------

          s += '''

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          '''

          p.write_text(s)

          # ============================================
          # FINAL VALIDATION
          # ============================================

          final = p.read_text()

          if "kotlinOptions" in final:
              raise SystemExit(
                  "ERROR: old kotlinOptions still exists"
              )

          if "jvmTarget = JavaVersion" in final:
              raise SystemExit(
                  "ERROR: old jvmTarget syntax still exists"
              )

          if "jvmTarget.set(" not in final:
              raise SystemExit(
                  "ERROR: compilerOptions JVM target missing"
              )

          if 'create("release")' not in final:
              raise SystemExit(
                  "ERROR: release signing config missing"
              )

          print("==========================================")
          print("ANDROID CONFIGURATION READY")
          print("==========================================")
          print("Kotlin: 2.3.21")
          print("Java/JVM: 17")
          print("Old kotlinOptions: REMOVED")
          print("compilerOptions: ENABLED")
          print("Google Services: ENABLED")
          print("Release Signing: ENABLED")
          print("Properties(): NOT USED")
          print("==========================================")
          PY

      - name: Add packages
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming

          flutter pub get

      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$STORE_PASS" ]; then
            echo "ERROR: STORE_PASS is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          test -s android/upload-keystore.jks

          cat > android/gradle.properties <<EOF
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Release signing configured."

      - name: Verify Firebase
        working-directory: app
        run: |
          set -e

          test -f android/app/google-services.json

          python3 - <<'PY'
          import json

          with open("android/app/google-services.json") as f:
              data = json.load(f)

          package_found = False
          web_client_found = False

          for client in data.get("client", []):

              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == "com.example.wika_live":
                  package_found = True

              for oauth in client.get("oauth_client", []):
                  if oauth.get("client_type") == 3:
                      web_client_found = True

          if not package_found:
              raise SystemExit(
                  "ERROR: com.example.wika_live "
                  "not found in google-services.json"
              )

          if not web_client_found:
              raise SystemExit(
                  "ERROR: Web OAuth client missing "
                  "from google-services.json"
              )

          print("Firebase package: OK")
          print("Web OAuth client: FOUND")
          PY

      - name: Verify signing
        working-directory: app
        run: |
          set -e

          test -f android/upload-keystore.jks
          test -f android/gradle.properties

          echo "Keystore: FOUND"
          echo "Signing: READY"

      - name: Analyze Dart
        working-directory: app
        run: |
          set -e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings
     
           - name: Configure Gradle memory and AndroidX
           working-directory: app
           run: |
          set -e

          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "Gradle memory: 4 GB"
          echo "AndroidX: ENABLED"
      - name: Build release APK
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo "ERROR: ZEGO_APP_SIGN is missing."
            exit 1
          fi

          flutter clean
          flutter pub get

          echo "=========================================="
          echo "BUILDING WIKALIVE APK"
          echo "=========================================="
          echo "Flutter: 3.35.4"
          echo "Kotlin: 2.3.21"
          echo "JVM: 17"
          echo "Google Sign-In: 7.2.0"
          echo "Firebase: ENABLED"
          echo "ZEGOCLOUD: ENABLED"
          echo "Signing: ENABLED"
          echo "=========================================="

          flutter build apk \
            --release \
            --dart-define=ZEGO_APP_SIGN="$ZEGO_APP_SIGN"
      - name: Verify APK Google Sign-In configuration
        working-directory: app
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "=========================================="
          echo "VERIFYING FINAL APK"
          echo "=========================================="

          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose "$APK"

          echo "=========================================="
          echo "APK CERTIFICATE SHA-1"
          echo "=========================================="

          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"

          echo "=========================================="
          echo "APK PACKAGE"
          echo "=========================================="

          unzip -p "$APK" AndroidManifest.xml >/dev/null

          echo "APK verification completed."
      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "=========================================="
          echo "WIKALIVE APK CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
