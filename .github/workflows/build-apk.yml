name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          test -f main.dart || {
            echo "ERROR: root main.dart is missing."
            exit 1
          }

          test -d assets/live_ui || {
            echo "ERROR: assets/live_ui folder is missing."
            exit 1
          }

          cp main.dart app/lib/main.dart

          mkdir -p app/assets

          cp -R assets/live_ui app/assets/live_ui

          test -f app/lib/main.dart
          test -f app/assets/live_ui/logo.png
          test -f app/assets/live_ui/ic_guardian_gold.png

          echo "=========================================="
          echo "WIKALIVE SOURCE COPIED"
          echo "=========================================="

          echo "main.dart:"
          ls -lh app/lib/main.dart

          echo ""
          echo "live_ui assets:"
          find app/assets/live_ui \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


      # ==========================================
      # 4. PATCH ZEGO API ONLY
      # ==========================================
      - name: Patch ZEGO API compatibility
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/lib/main.dart")
          text = path.read_text(encoding="utf-8")

          # Remove unsupported controller named parameters.
          text = text.replace(
              "    controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          text = text.replace(
              "      controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          # Current ZEGO microphone/camera switch API.
          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().microphone.toggle()",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.switchState()"
          )

          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().camera.toggle()",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.switchState()"
          )

          text = text.replace(
              "controller.microphone.toggle()",
              "controller.audioVideo.microphone.switchState()"
          )

          text = text.replace(
              "controller.camera.toggle()",
              "controller.audioVideo.camera.switchState()"
          )

          # ZEGO user state fields.
          text = text.replace(
              "u.isCameraOn || u.isMicrophoneOn",
              "u.camera.value || u.microphone.value"
          )

          text = re.sub(
              r"ZegoUIKitPrebuiltLiveStreamingController\(\)\s*\.\s*microphone(?:\s*\.\s*value)?",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.localState",
              text
          )

          text = re.sub(
              r"ZegoUIKitPrebuiltLiveStreamingController\(\)\s*\.\s*camera(?:\s*\.\s*value)?",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.localState",
              text
          )

          text = re.sub(
              r"(?<![A-Za-z0-9_])controller\s*\.\s*microphone(?:\s*\.\s*value)?",
              "controller.audioVideo.microphone.localState",
              text
          )

          text = re.sub(
              r"(?<![A-Za-z0-9_])controller\s*\.\s*camera(?:\s*\.\s*value)?",
              "controller.audioVideo.camera.localState",
              text
          )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          echo "Checking old ZEGO references..."

          if grep -qE \
            "ZegoUIKitPrebuiltLiveStreamingController\(\)[[:space:]]*\.[[:space:]]*(microphone|camera)" \
            app/lib/main.dart; then

            echo "ERROR: old ZEGO singleton getter remains."
            exit 1
          fi

          if grep -qE \
            "(^|[^A-Za-z0-9_])controller[[:space:]]*\.[[:space:]]*(microphone|camera)" \
            app/lib/main.dart; then

            echo "ERROR: old controller microphone/camera getter remains."
            exit 1
          fi

          if grep -qE \
            "isCameraOn|isMicrophoneOn" \
            app/lib/main.dart; then

            echo "ERROR: obsolete ZEGO user fields remain."
            exit 1
          fi

          echo "ZEGO compatibility patch verified."


      # ==========================================
      # 5. FIREBASE + ANDROID PERMISSIONS
      # ==========================================
      - name: Configure Firebase and Android
        shell: bash
        run: |
          set -e

          test -f google-services.json

          cp google-services.json \
            app/android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "\n    <application",
                      "\n" + permission + "\n    <application",
                      1
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          echo "Firebase copied."
          echo "Android permissions configured."


      # ==========================================
      # 6. FIREBASE + KOTLIN + GRADLE
      # ==========================================
      - name: Configure Firebase Kotlin and Gradle
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ==================================================
          # settings.gradle.kts
          # ==================================================
          settings = Path(
              "android/settings.gradle.kts"
          )

          text = settings.read_text(
              encoding="utf-8"
          )

          # Google Services plugin.
          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false
          """,
                  1
              )

          # Kotlin 2.3.21.
          kotlin_pattern = (
              r'id\("org\.jetbrains\.kotlin\.android"\)'
              r'\s+version\s+"[^"]+"'
              r'(?:\s+apply\s+false)?'
          )

          text = re.sub(
              kotlin_pattern,
              'id("org.jetbrains.kotlin.android") '
              'version "2.3.21" apply false',
              text,
              count=1
          )

          if 'id("org.jetbrains.kotlin.android")' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false
          """,
                  1
              )

          settings.write_text(
              text,
              encoding="utf-8"
          )


          # ==================================================
          # app/build.gradle.kts
          # ==================================================
          build = Path(
              "android/app/build.gradle.kts"
          )

          text = build.read_text(
              encoding="utf-8"
          )

          # Google Services app plugin.
          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services")
          """,
                  1
              )

          # Remove OLD Kotlin syntax.
          text = re.sub(
              r'\n[ \t]*kotlinOptions\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          text = re.sub(
              r'\n[ \t]*jvmTarget\s*=\s*JavaVersion\.VERSION_\d+\.toString\(\)',
              '',
              text
          )

          # Java 17.
          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          # Add compileOptions inside android block if absent.
          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              android_marker = "android {"

              if android_marker not in text:
                  raise SystemExit(
                      "ERROR: android block missing."
                  )

              compile_block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

          """

              position = (
                  text.find(android_marker)
                  + len(android_marker)
              )

              text = (
                  text[:position]
                  + "\n"
                  + compile_block
                  + text[position:]
              )

          # Kotlin 2.3 compilerOptions.
          # No import statement is required.
          if "jvmTarget.set(" not in text:
              text += """

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          """

          # ==================================================
          # Release signing
          # ==================================================
          if 'create("wikaliveRelease")' not in text:

              signing = r'''
          signingConfigs {
              create("wikaliveRelease") {
                  storeFile = file("upload-keystore.jks")
                  storePassword =
                      providers.gradleProperty("storePassword").orNull
                  keyAlias =
                      providers.gradleProperty("keyAlias").orNull
                  keyPassword =
                      providers.gradleProperty("keyPassword").orNull
              }
          }
          '''

              text = text.replace(
                  "buildTypes {",
                  signing + "\nbuildTypes {",
                  1
              )

          if (
              'signingConfig = signingConfigs.getByName("wikaliveRelease")'
              not in text
          ):

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("wikaliveRelease")""",
                  1
              )

          build.write_text(
              text,
              encoding="utf-8"
          )


          # ==================================================
          # gradle.properties
          # ==================================================
          gp = Path(
              "android/gradle.properties"
          )

          existing = (
              gp.read_text(encoding="utf-8")
              if gp.exists()
              else ""
          )

          def set_property(
              content,
              key,
              value
          ):
              lines = content.splitlines()
              result = []
              found = False

              for line in lines:
                  if line.startswith(key + "="):
                      if not found:
                          result.append(
                              key + "=" + value
                          )
                          found = True
                  else:
                      result.append(line)

              if not found:
                  result.append(
                      key + "=" + value
                  )

              return "\n".join(result) + "\n"

          existing = set_property(
              existing,
              "org.gradle.jvmargs",
              "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          )

          existing = set_property(
              existing,
              "org.gradle.daemon",
              "false"
          )

          existing = set_property(
              existing,
              "org.gradle.parallel",
              "false"
          )

          existing = set_property(
              existing,
              "org.gradle.caching",
              "false"
          )

          existing = set_property(
              existing,
              "android.useAndroidX",
              "true"
          )

          existing = set_property(
              existing,
              "android.enableJetifier",
              "true"
          )

          gp.write_text(
              existing,
              encoding="utf-8"
          )

          print("Android configuration complete.")
          print("Kotlin: 2.3.21")
          print("JVM: 17")
          print("AndroidX: enabled")
          print("Google Services: enabled")
          print("Release signing: configured")
          PY


      # ==========================================
      # 7. ADD REQUIRED PACKAGES
      # ==========================================
      - name: Add packages
        working-directory: app
        shell: bash
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          flutter pub get


      # ==========================================
      # 8. CONFIGURE LIVE UI ASSETS
      # ==========================================
      - name: Configure live UI assets
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")
          lines = path.read_text(
              encoding="utf-8"
          ).splitlines()

          # Find root flutter section.
          flutter_index = None

          for i, line in enumerate(lines):
              if (
                  line.strip() == "flutter:"
                  and not line.startswith(" ")
                  and not line.startswith("\t")
              ):
                  flutter_index = i
                  break

          if flutter_index is None:
              raise SystemExit(
                  "ERROR: root flutter section missing."
              )

          # Remove existing assets block under flutter.
          cleaned = []
          i = 0

          while i < len(lines):

              if (
                  i > flutter_index
                  and lines[i].strip() == "assets:"
                  and lines[i].startswith("  ")
              ):
                  i += 1

                  while i < len(lines):
                      line = lines[i]

                      if (
                          line.strip()
                          and not line.startswith(" ")
                          and not line.startswith("\t")
                      ):
                          break

                      i += 1

                  continue

              cleaned.append(lines[i])
              i += 1

          lines = cleaned

          flutter_index = next(
              i for i, line in enumerate(lines)
              if (
                  line.strip() == "flutter:"
                  and not line.startswith(" ")
                  and not line.startswith("\t")
              )
          )

          lines[
              flutter_index + 1:flutter_index + 1
          ] = [
              "  assets:",
              "    - assets/live_ui/",
          ]

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY

          flutter pub get

          test -f assets/live_ui/logo.png
          test -f assets/live_ui/ic_guardian_gold.png

          echo "live_ui assets configured."


      # ==========================================
      # 9. VERIFY FIREBASE
      # ==========================================
      - name: Verify Firebase
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          project_id = (
              data
              .get("project_info", {})
              .get("project_id")
          )

          if project_id != "wika-live":
              raise SystemExit(
                  f"ERROR: wrong Firebase project: {project_id}"
              )

          print("Firebase project: wika-live")
          print("Firebase configuration: OK")
          PY


      # ==========================================
      # 10. VERIFY SIGNING SECRETS
      # ==========================================
      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "Checking signing secrets..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$STORE_PASS" ]; then
            echo "ERROR: KEYSTORE_PASS is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | \
            base64 --decode > \
            android/app/upload-keystore.jks

          test -s \
            android/app/upload-keystore.jks

          echo "=========================================="
          echo "RELEASE KEYSTORE FOUND"
          echo "=========================================="

          keytool -list \
            -keystore android/app/u
