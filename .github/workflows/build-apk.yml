name: Build WikaLive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      # =========================================================
      # 3. CREATE FRESH FLUTTER ANDROID PROJECT
      # =========================================================
      - name: Create Flutter project
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          cp main.dart app/lib/main.dart

          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json is missing from repository root."
            exit 1
          fi

          cp google-services.json app/android/app/google-services.json

          echo "Flutter project created successfully."

      # =========================================================
      # 4. CONFIGURE ANDROID / KOTLIN / FIREBASE
      # =========================================================
      - name: Configure Android Kotlin and Firebase
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import json

          # =====================================================
          # SETTINGS.GRADLE.KTS
          # =====================================================
          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()

          # Kotlin Gradle Plugin
          kotlin_pattern = (
              r'id\("org\.jetbrains\.kotlin\.android"\)'
              r'\s+version\s+"[^"]+"'
              r'\s+apply\s+false'
          )

          kotlin_replacement = (
              'id("org.jetbrains.kotlin.android") '
              'version "2.3.21" apply false'
          )

          if re.search(kotlin_pattern, s):
              s = re.sub(
                  kotlin_pattern,
                  kotlin_replacement,
                  s,
                  count=1
              )
          else:
              s = s.replace(
                  "plugins {",
                  '''plugins {
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false''',
                  1
              )

          # Google Services Gradle Plugin
          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  "plugins {",
                  '''plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false''',
                  1
              )

          settings.write_text(s)

          # =====================================================
          # APP/BUILD.GRADLE.KTS
          # =====================================================
          app_gradle = Path("android/app/build.gradle.kts")
          s = app_gradle.read_text()

          # Google Services plugin
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  '''plugins {
              id("com.google.gms.google-services")''',
                  1
              )

          # =====================================================
          # JAVA 17
          # =====================================================
          s = s.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          # =====================================================
          # KOTLIN JVM 17
          # =====================================================
          if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in s:
              s = (
                  "import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n"
                  + s
              )

          if "kotlin {" not in s:
              s += '''

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }
          '''
          elif "jvmTarget.set(JvmTarget.JVM_17)" not in s:
              s += '''

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }
          '''

          # =====================================================
          # RELEASE SIGNING CONFIG
          # =====================================================
          if "signingConfigs" not in s:
              signing_block = '''

          signingConfigs {
              create("release") {
                  val propsFile = rootProject.file("key.properties")
                  val props = java.util.Properties()

                  if (propsFile.exists()) {
                      propsFile.inputStream().use {
                          props.load(it)
                      }

                      storeFile =
                          rootProject.file(
                              props.getProperty("storeFile")
                          )

                      storePassword =
                          props.getProperty("storePassword")

                      keyAlias =
                          props.getProperty("keyAlias")

                      keyPassword =
                          props.getProperty("keyPassword")
                  }
              }
          }
          '''

              s = s.replace(
                  "buildTypes {",
                  signing_block + "\nbuildTypes {",
                  1
              )

          # Replace Flutter's default debug signing on release
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          # If release signingConfig somehow wasn't present,
          # add it inside release block.
          if (
              'signingConfig = signingConfigs.getByName("release")'
              not in s
          ):
              s = s.replace(
                  "release {",
                  '''release {
                      signingConfig =
                          signingConfigs.getByName("release")''',
                  1
              )

          app_gradle.write_text(s)

          # =====================================================
          # VERIFY GOOGLE SERVICES JSON
          # =====================================================
          google_json = Path("android/app/google-services.json")

          if not google_json.exists():
              raise SystemExit(
                  "ERROR: android/app/google-services.json missing."
              )

          data = json.loads(google_json.read_text())

          clients = data.get("client", [])

          android_package_found = False
          web_oauth_found = False

          for client in clients:
              client_info = client.get("client_info", {})

              android_info = client_info.get(
                  "android_client_info",
                  {}
              )

              package_name = android_info.get(
                  "package_name"
              )

              if package_name == "com.example.wika_live":
                  android_package_found = True

              for oauth in client.get("oauth_client", []):
                  if oauth.get("client_type") == 3:
                      web_oauth_found = True

          if not android_package_found:
              raise SystemExit(
                  "ERROR: google-services.json does not contain "
                  "com.example.wika_live"
              )

          if not web_oauth_found:
              raise SystemExit(
                  "ERROR: google-services.json does not contain "
                  "a Web OAuth client (client_type 3)."
              )

          print("==========================================")
          print("ANDROID CONFIGURATION VERIFIED")
          print("==========================================")
          print("Kotlin: 2.3.21")
          print("JVM Target: 17")
          print("Google Services: 4.4.3")
          print("Package: com.example.wika_live")
          print("Web OAuth Client: FOUND")
          print("==========================================")
          PY

      # =========================================================
      # 5. ADD FLUTTER PACKAGES
      # =========================================================
      - name: Add packages
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming

          flutter pub get

          echo "All Flutter packages installed."

      # =========================================================
      # 6. RELEASE SIGNING
      # =========================================================
      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking Android signing secrets..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASS is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          # Put keystore directly inside android/
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          if [ ! -s android/upload-keystore.jks ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          # key.properties
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "Release signing configured successfully."

      # =========================================================
      # 7. VERIFY SIGNING CONFIG
      # =========================================================
      - name: Verify signing configuration
        working-directory: app
        run: |
          set -e

          test -f android/upload-keystore.jks
          test -f android/key.properties

          echo "Keystore: FOUND"
          echo "key.properties: FOUND"
          echo "Release signing: READY"

      # =========================================================
      # 8. ANALYZE DART
      # =========================================================
      - name: Analyze Dart
        working-directory: app
        run: |
          set -e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # =========================================================
      # 9. BUILD RELEASE APK
      # =========================================================
      - name: Build release APK
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo "ERROR: ZEGO_APP_SIGN GitHub Secret is missing."
            exit 1
          fi

          flutter clean
          flutter pub get

          echo "=========================================="
          echo "BUILDING WIKALIVE RELEASE APK"
          echo "=========================================="
          echo "Flutter: 3.35.4"
          echo "Kotlin: 2.3.21"
          echo "Google Sign-In: 7.2.0"
          echo "Firebase: ENABLED"
          echo "ZEGOCLOUD: ENABLED"
          echo "Release Signing: ENABLED"
          echo "=========================================="

          flutter build apk \
            --release \
            --dart-define=ZEGO_APP_SIGN="$ZEGO_APP_SIGN"

      # =========================================================
      # 10. VERIFY APK
      # =========================================================
      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "=========================================="
          echo "WIKALIVE APK CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"

      # =========================================================
      # 11. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
