name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          echo "Flutter project created."

          # Root source
          test -f main.dart || {
            echo "ERROR: root main.dart is missing"
            exit 1
          }

          # Reference UI assets
          test -d assets/live_ui || {
            echo "ERROR: assets/live_ui is missing"
            exit 1
          }

          # Copy WikaLive source
          cp main.dart app/lib/main.dart

          # Copy reference live UI assets
          mkdir -p app/assets
          cp -R assets/live_ui app/assets/live_ui

          echo "WikaLive main.dart copied."
          echo "WikaLive live UI assets copied."


      # ==========================================
      # 4. PATCH ZEGO API COMPATIBILITY
      # ==========================================
      - name: Patch ZEGO API compatibility
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/lib/main.dart")

          if not path.exists():
              raise SystemExit(
                  "ERROR: app/lib/main.dart is missing"
              )

          text = path.read_text()

          # ------------------------------------------
          # Remove unsupported controller parameter
          # ------------------------------------------
          text = text.replace(
              "    controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          text = text.replace(
              "      controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          text = text.replace(
              "        controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          # ------------------------------------------
          # Microphone toggle
          # ------------------------------------------
          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().microphone.toggle()",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.switchState()"
          )

          text = text.replace(
              "controller.microphone.toggle()",
              "controller.audioVideo.microphone.switchState()"
          )

          # ------------------------------------------
          # Camera toggle
          # ------------------------------------------
          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().camera.toggle()",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.switchState()"
          )

          text = text.replace(
              "controller.camera.toggle()",
              "controller.audioVideo.camera.switchState()"
          )

          path.write_text(text)

          print("ZEGO compatibility patch completed.")
          PY


      # ==========================================
      # 5. FIREBASE
      # ==========================================
      - name: Configure Firebase
        shell: bash
        run: |
          set -e

          test -f google-services.json || {
            echo "ERROR: google-services.json is missing"
            exit 1
          }

          mkdir -p app/android/app

          cp google-services.json \
            app/android/app/google-services.json

          echo "Firebase configuration copied."


      # ==========================================
      # 6. ANDROID PERMISSIONS
      # ==========================================
      - name: Configure Android permissions
        shell: bash
        run: |
          set -e

          MANIFEST="app/android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST" || {
            echo "ERROR: AndroidManifest.xml is missing"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]

          missing = [
              permission
              for permission in permissions
              if permission not in text
          ]

          if missing:
              marker = "<application"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: Android application tag not found"
                  )

              text = text.replace(
                  marker,
                  "\n".join(missing)
                  + "\n\n    "
                  + marker,
                  1
              )

          path.write_text(text)

          print("Android permissions configured.")
          PY


      # ==========================================
      # 7. GOOGLE SERVICES
      # ==========================================
      - name: Configure Google Services
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          # ------------------------------------------
          # settings.gradle.kts
          # ------------------------------------------
          settings = Path(
              "app/android/settings.gradle.kts"
          )

          text = settings.read_text()

          if "com.google.gms.google-services" not in text:

              marker = "plugins {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: settings plugins block not found"
                  )

              text = text.replace(
                  marker,
                  marker
                  + '\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                  1
              )

          settings.write_text(text)

          # ------------------------------------------
          # app/build.gradle.kts
          # ------------------------------------------
          app_gradle = Path(
              "app/android/app/build.gradle.kts"
          )

          app_text = app_gradle.read_text()

          if 'id("com.google.gms.google-services")' not in app_text:

              marker = "plugins {"

              if marker not in app_text:
                  raise SystemExit(
                      "ERROR: app plugins block not found"
                  )

              app_text = app_text.replace(
                  marker,
                  marker
                  + '\n    id("com.google.gms.google-services")',
                  1
              )

          app_gradle.write_text(app_text)

          print("Google Services configured.")
          PY


      # ==========================================
      # 8. ANDROIDX
      # ==========================================
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROPERTIES="app/android/gradle.properties"

          grep -q "^android.useAndroidX=true$" "$PROPERTIES" || \
            echo "android.useAndroidX=true" >> "$PROPERTIES"

          grep -q "^android.enableJetifier=true$" "$PROPERTIES" || \
            echo "android.enableJetifier=true" >> "$PROPERTIES"

          echo "AndroidX configured."


      # ==========================================
      # 9. FLUTTER DEPENDENCIES
      # ==========================================
      - name: Configure Flutter dependencies
        shell: bash
        run: |
          set -e

          cd app

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          cd ..


      # ==========================================
      # 10. CONFIGURE ASSETS
      # ==========================================
      #
      # IMPORTANT:
      # The dependency section MUST remain:
      #
      # dependencies:
      #   flutter:
      #     sdk: flutter
      #
      # The assets section belongs to the ROOT flutter:
      # section at the bottom of pubspec.yaml.
      #
      # This step finds the LAST root-level "flutter:"
      # and adds assets there.
      #
      # ==========================================
      - name: Configure Flutter assets
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/pubspec.yaml")

          if not path.exists():
              raise SystemExit(
                  "ERROR: app/pubspec.yaml is missing"
              )

          lines = path.read_text().splitlines()

          # ------------------------------------------
          # Find the LAST exact root-level flutter:
          #
          # This is the Flutter configuration section,
          # NOT:
          #
          # dependencies:
          #   flutter:
          #     sdk: flutter
          # ------------------------------------------
          flutter_indexes = [
              i
              for i, line in enumerate(lines)
              if line == "flutter:"
          ]

          if not flutter_indexes:
              raise SystemExit(
                  "ERROR: root flutter: section not found"
              )

          flutter_index = flutter_indexes[-1]

          # ------------------------------------------
          # Check whether asset already exists.
          # ------------------------------------------
          if any(
              line.strip() == "- assets/live_ui/"
              for line in lines
          ):
              print(
                  "assets/live_ui already exists."
              )
          else:

              # --------------------------------------
              # Look for existing assets: section
              # inside root flutter section.
              # --------------------------------------
              assets_index = None

              for i in range(
                  flutter_index + 1,
                  len(lines)
              ):
                  line = lines[i]

                  # Stop at next root-level YAML key.
                  if (
                      line.strip()
                      and not line.startswith(" ")
                      and not line.startswith("\t")
                  ):
                      break

                  if line.strip() == "assets:":
                      assets_index = i
                      break

              if assets_index is not None:

                  # Existing assets section.
                  lines.insert(
                      assets_index + 1,
                      "    - assets/live_ui/"
                  )

              else:

                  # New assets section.
                  lines.insert(
                      flutter_index + 1,
                      "  assets:"
                  )

                  lines.insert(
                      flutter_index + 2,
                      "    - assets/live_ui/"
                  )

          path.write_text(
              "\n".join(lines) + "\n"
          )

          print(
              "pubspec.yaml assets configured correctly."
          )
          PY

          echo "=========================================="
          echo "CHECKING PUBSPEC"
          echo "=========================================="

          sed -n '1,140p' app/pubspec.yaml

          echo "=========================================="
          echo "RUNNING FLUTTER PUB GET"
          echo "=========================================="

          cd app

          flutter pub get

          cd ..

          echo "PUBSPEC OK."


      # ==========================================
      # 11. VERIFY LIVE UI ASSETS
      # ==========================================
      - name: Verify WikaLive live UI assets
        shell: bash
        run: |
          set -e

          test -d app/assets/live_ui || {
            echo "ERROR: app/assets/live_ui is missing"
            exit 1
          }

          test -f app/assets/live_ui/logo.png || {
            echo "ERROR: assets/live_ui/logo.png is missing"
            exit 1
          }

          test -f app/assets/live_ui/ic_guardian_gold.png || {
            echo "ERROR: assets/live_ui/ic_guardian_gold.png is missing"
            exit 1
          }

          echo "=========================================="
          echo "LIVE UI ASSETS VERIFIED"
          echo "=========================================="

          find app/assets/live_ui \
            -maxdepth 1 \
            -type f \
            -print


      # ==========================================
      # 12. VERIFY FIREBASE
      # ==========================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "app/android/app/google-services.json"
          )

          data = json.loads(
              path.read_text()
          )

          project_id = (
              data
              .get("project_info", {})
              .get("project_id")
          )

          if project_id != "wika-live":
              raise SystemExit(
                  f"ERROR: Unexpected Firebase project: {project_id}"
              )

          print(
              "Firebase project verified: wika-live"
          )
          PY


      # ==========================================
      # 13. RELEASE SIGNING
      # ==========================================
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking signing secrets..."

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASS" || {
            echo "ERROR: KEYSTORE_PASS is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > app/android/app/wikalive-release.jks

          test -s app/android/app/wikalive-release.jks || {
            echo "ERROR: release keystore was not created."
            exit 1
          }

          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=wikalive-release.jks
          EOF

          echo "Release signing files created."


      # ==========================================
      # 14. CONFIGURE RELEASE SIGNING IN GRADLE
      # ==========================================
      - name: Configure Gradle release signing
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/android/app/build.gradle.kts"
          )

          text = path.read_text()

          # ------------------------------------------
          # Add Properties imports/configuration.
          # ------------------------------------------
          if "keystorePropertiesFile" not in text:

              header = """import java.util.Properties
          import java.io.FileInputStream

          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties =
              Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(
                      keystorePropertiesFile
                  )
              )
          }

          """

              text = header + text

          # ------------------------------------------
          # Add release signing config.
          # ------------------------------------------
          if 'create("release")' not in text:

              marker = "android {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: android block not found"
                  )

              signing = """android {
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]
                              ?.let { file(it) }

                      storePassword =
                          keystoreProperties["storePassword"] as String?
                  }
              }
          """

              text = text.replace(
                  marker,
                  signing,
                  1
              )

          # ------------------------------------------
          # Ensure release build type uses release key.
          # ------------------------------------------
          if (
              'signingConfig = signingConfigs.getByName("release")'
              not in text
          ):

              marker = 'getByName("release") {'

              if marker in text:

                  text = text.replace(
                      marker,
                      marker
                      + '\n'
                      + '            signingConfig = signingConfigs.getByName("release")',
                      1
                  )

              else:

                  text += """

          android {
              buildTypes {
                  getByName("release") {
                      signingConfig =
                          signingConfigs.getByName("release")
                  }
              }
          }
          """

          path.write_text(text)

          print(
              "Gradle release signing configured."
          )
          PY


      # ==========================================
      # 15. FLUTTER ANALYZE
      # ==========================================
      - name: Analyze Flutter project
        shell: bash
        run: |
          set -e

          cd app

          flutter analyze --no-fatal-infos

          cd ..


      # ==========================================
      # 16.
