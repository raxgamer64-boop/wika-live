name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          test -f main.dart
          test -d assets/live_ui
          test -f google-services.json

          cp main.dart app/lib/main.dart

          mkdir -p app/assets/live_ui
          cp -R assets/live_ui/. app/assets/live_ui/

          cp google-services.json \
            app/android/app/google-services.json

          test -f app/lib/main.dart
          test -f app/android/app/google-services.json
          test -f app/assets/live_ui/logo.png

          echo "=========================================="
          echo "WIKALIVE FLUTTER PROJECT READY"
          echo "=========================================="


      # ==========================================
      # 4. PATCH ZEGO COMPATIBILITY
      # ==========================================
      - name: Patch ZEGO API compatibility
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/lib/main.dart")
          text = p.read_text(encoding="utf-8")

          text = text.replace(
              "    controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          text = text.replace(
              "      controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().microphone.toggle()",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.switchState()"
          )

          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().camera.toggle()",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.switchState()"
          )

          text = text.replace(
              "controller.microphone.toggle()",
              "controller.audioVideo.microphone.switchState()"
          )

          text = text.replace(
              "controller.camera.toggle()",
              "controller.audioVideo.camera.switchState()"
          )

          text = text.replace(
              "u.isCameraOn || u.isMicrophoneOn",
              "u.camera.value || u.microphone.value"
          )

          text = re.sub(
              r"ZegoUIKitPrebuiltLiveStreamingController\(\)\s*\.\s*microphone(?:\s*\.\s*value)?",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.localState",
              text
          )

          text = re.sub(
              r"ZegoUIKitPrebuiltLiveStreamingController\(\)\s*\.\s*camera(?:\s*\.\s*value)?",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.localState",
              text
          )

          p.write_text(text, encoding="utf-8")
          PY

          if grep -qE "isCameraOn|isMicrophoneOn" app/lib/main.dart; then
            echo "ERROR: old ZEGO fields remain."
            exit 1
          fi

          echo "ZEGO compatibility patch OK."


      # ==========================================
      # 5. ANDROID PERMISSIONS
      # ==========================================
      - name: Configure Android permissions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/android/app/src/main/AndroidManifest.xml"
          )

          text = p.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "\n    <application",
                      "\n" + permission + "\n    <application",
                      1
                  )

          p.write_text(text, encoding="utf-8")
          PY

          echo "Android permissions configured."


      # ==========================================
      # 6. FIREBASE + KOTLIN + GRADLE
      # ==========================================
      - name: Configure Android Gradle
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------
          # settings.gradle.kts
          # ------------------------------------------
          settings = Path("android/settings.gradle.kts")
          s = settings.read_text(encoding="utf-8")

          s = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false',
              s,
              count=1
          )

          if 'id("org.jetbrains.kotlin.android")' not in s:
              s = s.replace(
                  "plugins {",
                  """plugins {
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false
          """,
                  1
              )

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false
          """,
                  1
              )

          settings.write_text(s, encoding="utf-8")


          # ------------------------------------------
          # app/build.gradle.kts
          # ------------------------------------------
          build = Path("android/app/build.gradle.kts")
          s = build.read_text(encoding="utf-8")

          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services")
          """,
                  1
              )

          # Remove old Kotlin DSL.
          s = re.sub(
              r'\n[ \t]*kotlinOptions\s*\{.*?\n[ \t]*\}',
              '',
              s,
              flags=re.DOTALL
          )

          # Java 17.
          s = s.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "android {",
                  """android {

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )

          # Signing.
          if 'create("wikaliveRelease")' not in s:
              signing = """
          signingConfigs {
              create("wikaliveRelease") {
                  storeFile = file("upload-keystore.jks")
                  storePassword =
                      providers.gradleProperty("storePassword").orNull
                  keyAlias =
                      providers.gradleProperty("keyAlias").orNull
                  keyPassword =
                      providers.gradleProperty("keyPassword").orNull
              }
          }

          """

              s = s.replace(
                  "buildTypes {",
                  signing + "buildTypes {",
                  1
              )

          if 'signingConfig = signingConfigs.getByName("wikaliveRelease")' not in s:
              s = s.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("wikaliveRelease")""",
                  1
              )

          # Kotlin compiler JVM 17.
          if "jvmTarget.set(" not in s:
              s += """

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          """

          build.write_text(s, encoding="utf-8")


          # ------------------------------------------
          # gradle.properties
          # ------------------------------------------
          gp = Path("android/gradle.properties")

          gp.write_text(
              """org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=false
          android.useAndroidX=true
          android.enableJetifier=true
          """,
              encoding="utf-8"
          )

          print("Kotlin 2.3.21 configured.")
          print("Java 17 configured.")
          print("Google Services configured.")
          print("Release signing configured.")
          PY


      # ==========================================
      # 7. PACKAGES
      # ==========================================
      - name: Add packages
        working-directory: app
        shell: bash
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          flutter pub get


      # ==========================================
      # 8. LIVE UI ASSETS
      # ==========================================
      - name: Configure live UI assets
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          text = p.read_text(encoding="utf-8")

          if "    - assets/live_ui/" not in text:
              if "\nflutter:\n" in text:
                  text = text.replace(
                      "\nflutter:\n",
                      "\nflutter:\n  assets:\n    - assets/live_ui/\n",
                      1
                  )
              else:
                  text += "\nflutter:\n  assets:\n    - assets/live_ui/\n"

          p.write_text(text, encoding="utf-8")
          PY

          flutter pub get

          test -f assets/live_ui/logo.png

          echo "Live UI assets configured."


      # ==========================================
      # 9. VERIFY FIREBASE
      # ==========================================
      - name: Verify Firebase
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          project_id = (
              data
              .get("project_info", {})
              .get("project_id")
          )

          if project_id != "wika-live":
              raise SystemExit(
                  "ERROR: Firebase project is not wika-live."
              )

          found = False

          for client in data.get("client", []):
              package = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package == "com.example.wika_live":
                  found = True

          if not found:
              raise SystemExit(
                  "ERROR: com.example.wika_live not found."
              )

          print("Firebase verification OK.")
          PY


      # ==========================================
      # 10. RELEASE KEYSTORE
      # ==========================================
      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p android/app

          KEYSTORE_PATH="android/app/upload-keystore.jks"

          rm -f "$KEYSTORE_PATH"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          test -f "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          echo "Keystore created:"
          ls -lh "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" \
            -v | grep -E "Alias name:|Entry type:|SHA1:"

          echo "Release signing verified."


      # ==========================================
      # 11. VERIFY KOTLIN
      # ==========================================
      - name: Verify Kotlin configuration
        working-directory: app
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          ! grep -q "kotlinOptions" "$FILE"
          grep -q "compilerOptions" "$FILE"
          grep -q "JvmTarget.JVM_17" "$FILE"
          grep -q "VERSION_17" "$FILE"

          echo "Kotlin configuration OK."


      # ==========================================
      # 12. ANALYZE DART
      # ==========================================
      - name: Analyze Dart
        working-directory: app
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true


      # ==========================================
      # 13. BUILD RELEASE APK
      # ==========================================
      - name: Build release APK
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASS }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo "ERROR: ZEGO_APP_SIGN is missing."
            exit 1
          fi

          flutter clean
          flutter pub get

          echo "=========================================="
          echo "BUILDING WIKALIVE APK"
          echo "=========================================="

          flutter build apk \
            --release \
            --dart-define=ZEGO_APP_SIGN="$ZEGO_APP_SIGN"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK CREATED:"
          ls -lh "$APK"


      # ==========================================
      # 14. BUILD RELEASE AAB
      # ==========================================
      - name: Build release AAB
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASS }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo "ERROR: ZEGO_APP_SIGN is missing."
            exit 1
          fi

          echo "=========================================="
          echo "BUILDING WIKALIVE AAB"
          echo "=========================================="

          flutter build appbundle \
            --release \
            --dart-define=ZEGO_APP_SIGN="$ZEGO_APP_SIGN"

          AAB="build/app/outputs/bundle/release/app-release.aab"

          test -f "$AAB"

          echo "AAB CREATED:"
          ls -lh "$AAB"


      # ==========================================
      # 15. VERIFY APK SIGNATURE
      # ==========================================
      - name: Verify APK signature
        working-directory: app
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          "$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK signature verified."


      # ==========================================
      # 16. VERIFY FINAL FILES
      # ==========================================
      - name: Verify final APK and AAB
        working-directory: app
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"

          test -f "$APK"
          test -f "$AAB"

          echo "=========================================="
          echo "FINAL BUILD FILES"
          echo "=========================================="

          ls -lh "$APK"
          ls -lh "$AAB"


      # ==========================================
      # 17. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14


      # ==========================================
      # 18. UPLOAD AAB
      # ==========================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14


      # ==========================================
      # 19. FINAL SUCCESS
      # ==========================================
      - name: Build completed
        shell: bash
        run: |
          echo "=========================================="
          echo "WIKALIVE BUILD SUCCESS"
          echo "=========================================="
          echo "APK: WikaLive-release-apk"
          echo "AAB: WikaLive-release-aab"
          echo "=========================================="
