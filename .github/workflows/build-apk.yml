name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. FLUTTER
      # ==================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true


      # ==================================================
      # 3. CREATE FRESH FLUTTER PROJECT
      # ==================================================
      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            app

          test -f main.dart || {
            echo "ERROR: main.dart missing."
            exit 1
          }

          test -d assets/live_ui || {
            echo "ERROR: assets/live_ui missing."
            exit 1
          }

          mkdir -p app/lib
          mkdir -p app/assets

          cp main.dart app/lib/main.dart
          cp -R assets/live_ui app/assets/live_ui

          echo "WikaLive source copied."


      # ==================================================
      # 4. KOTLIN / GRADLE CONFIGURATION
      # ==================================================
      - name: Configure Kotlin and Android Gradle
        shell: bash
        run: |
          set -e

          SETTINGS="app/android/settings.gradle.kts"
          APP="app/android/app/build.gradle.kts"

          test -f "$SETTINGS"
          test -f "$APP"

          # ----------------------------------------------
          # Kotlin 2.3.0
          # ----------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"',
              'id("org.jetbrains.kotlin.android") version "2.3.0"',
              text
          )

          if 'id("org.jetbrains.kotlin.android")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("org.jetbrains.kotlin.android") version "2.3.0"',
                  1
              )

          path.write_text(text, encoding="utf-8")
          PY

          # ----------------------------------------------
          # Android Gradle Plugin
          # ----------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'id\("com\.android\.application"\)\s+version\s+"[^"]+"',
              'id("com.android.application") version "8.7.3"',
              text
          )

          path.write_text(text, encoding="utf-8")
          PY

          # ----------------------------------------------
          # IMPORTANT:
          # Clean the generated app/build.gradle.kts
          # and configure Kotlin 2.3 compilerOptions.
          #
          # NO import statement is added.
          # NO kotlinOptions is used.
          # ----------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # Remove any old kotlinOptions block.
          text = re.sub(
              r'\n[ \t]*kotlinOptions\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.S
          )

          # Remove any previous compilerOptions block if present.
          text = re.sub(
              r'\n[ \t]*kotlin\s*\{\s*compilerOptions\s*\{.*?\n[ \t]*\}\s*\}',
              '',
              text,
              flags=re.S
          )

          # Remove previously inserted compileOptions blocks.
          text = re.sub(
              r'\n[ \t]*compileOptions\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.S
          )

          # ------------------------------------------------
          # Java 17 compileOptions.
          # Insert INSIDE the existing android block.
          # ------------------------------------------------
          android_marker = "android {"

          if android_marker not in text:
              raise SystemExit(
                  "ERROR: android { block not found."
              )

          android_pos = text.find(android_marker)
          insert_pos = android_pos + len(android_marker)

          java_block = r'''

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          '''

          text = (
              text[:insert_pos]
              + java_block
              + text[insert_pos:]
          )

          # ------------------------------------------------
          # Kotlin 2.3 compilerOptions.
          #
          # Fully-qualified type means NO import is needed.
          # ------------------------------------------------
          kotlin_block = r'''
          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }

          '''

          text = kotlin_block + text

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          # ----------------------------------------------
          # AndroidX
          # ----------------------------------------------
          PROPERTIES="app/android/gradle.properties"

          touch "$PROPERTIES"

          grep -q '^android.useAndroidX=true' "$PROPERTIES" || \
            echo 'android.useAndroidX=true' >> "$PROPERTIES"

          grep -q '^android.enableJetifier=true' "$PROPERTIES" || \
            echo 'android.enableJetifier=true' >> "$PROPERTIES"

          # ----------------------------------------------
          # HARD CHECK:
          # old syntax MUST NOT exist.
          # ----------------------------------------------
          if grep -q "kotlinOptions" "$APP"; then
            echo "ERROR: kotlinOptions still exists."
            grep -n "kotlinOptions" "$APP"
            exit 1
          fi

          if grep -q "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" "$APP"; then
            echo "ERROR: JvmTarget import unexpectedly exists."
            exit 1
          fi

          grep -q "compilerOptions" "$APP" || {
            echo "ERROR: compilerOptions missing."
            exit 1
          }

          grep -q "JvmTarget.JVM_17" "$APP" || {
            echo "ERROR: JVM_17 missing."
            exit 1
          }

          grep -q "VERSION_17" "$APP" || {
            echo "ERROR: Java 17 missing."
            exit 1
          }

          echo ""
          echo "=========================================="
          echo "KOTLIN CONFIGURATION VERIFIED"
          echo "=========================================="

          grep -n \
            -E "compilerOptions|JvmTarget|VERSION_17|kotlinOptions" \
            "$APP" || true


      # ==================================================
      # 5. FIREBASE
      # ==================================================
      - name: Configure Firebase
        shell: bash
        run: |
          set -e

          test -f google-services.json || {
            echo "ERROR: google-services.json missing."
            exit 1
          }

          cp google-services.json \
            app/android/app/google-services.json

          echo "Firebase configuration copied."


      # ==================================================
      # 6. GOOGLE SERVICES
      # ==================================================
      - name: Configure Google Services
        shell: bash
        run: |
          set -e

          SETTINGS="app/android/settings.gradle.kts"
          APP="app/android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          # settings.gradle.kts
          path = Path("app/android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n'
                  '    id("com.google.gms.google-services") '
                  'version "4.4.3" apply false',
                  1
              )

          path.write_text(text, encoding="utf-8")

          # app/build.gradle.kts
          path = Path("app/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n'
                  '    id("com.google.gms.google-services")',
                  1
              )

          path.write_text(text, encoding="utf-8")
          PY

          echo "Google Services configured."


      # ==================================================
      # 7. ANDROID PERMISSIONS
      # ==================================================
      - name: Configure Android permissions
        shell: bash
        run: |
          set -e

          MANIFEST="app/android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
          ]

          marker = "<application"

          additions = ""

          for permission in permissions:
              if permission not in text:
                  additions += "    " + permission + "\n"

          if additions and marker in text:
              text = text.replace(
                  marker,
                  additions + "\n    " + marker,
                  1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          echo "Android permissions configured."


      # ==================================================
      # 8. FLUTTER DEPENDENCIES
      # ==================================================
      - name: Configure Flutter dependencies
        working-directory: app
        shell: bash
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          flutter pub get


      # ==================================================
      # 9. LIVE UI ASSETS
      # ==================================================
      - name: Configure live UI assets
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")

          if "    - assets/live_ui/" not in text:

              lines = text.splitlines(True)

              indexes = []

              for i, line in enumerate(lines):
                  if re.match(r"^flutter:\s*$", line):
                      indexes.append(i)

              if not indexes:
                  raise SystemExit(
                      "ERROR: flutter section missing."
                  )

              idx = indexes[-1]
              insert_at = idx + 1

              while insert_at < len(lines):
                  line = lines[insert_at]

                  if line.strip() and not line.startswith(" "):
                      break

                  insert_at += 1

              lines[insert_at:insert_at] = [
                  "\n",
                  "  assets:\n",
                  "    - assets/live_ui/\n"
              ]

              path.write_text(
                  "".join(lines),
                  encoding="utf-8"
              )

          print("live_ui asset configuration complete.")
          PY

          flutter pub get


      # ==================================================
      # 10. VERIFY ASSETS
      # ==================================================
      - name: Verify live UI assets
        shell: bash
        run: |
          set -e

          REQUIRED_ASSETS=(
            "logo.png"
            "ic_guardian_gold.png"
            "ic_guardian_diamond.png"
            "iv_gift_btn.png"
            "iv_live_rule_logo.png"
            "iv_live_team_pk_blue_seat.png"
            "iv_live_team_pk_red_seat.png"
            "iv_lucky_button.png"
            "iv_quick_gift.png"
            "bg_treasure_box.png"
          )

          for FILE in "${REQUIRED_ASSETS[@]}"; do
            if [ ! -f "app/assets/live_ui/$FILE" ]; then
              echo "ERROR: Missing asset: $FILE"
              exit 1
            fi
          done

          echo "All live UI assets verified."


      # ==================================================
      # 11. VERIFY FIREBASE PROJECT
      # ==================================================
      - name: Verify Firebase project
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json

          with open(
              "app/android/app/google-services.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          project_id = (
              data
              .get("project_info", {})
              .get("project_id")
          )

          print("Firebase project:", project_id)

          if project_id != "wika-live":
              raise SystemExit(
                  "ERROR: Firebase project is not wika-live."
              )
          PY


      # ==================================================
      # 12. RELEASE SIGNING
      # ==================================================
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking signing secrets..."

          missing=0

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            missing=1
          fi

          if [ -z "$KEYSTORE_PASS" ]; then
            echo "ERROR: KEYSTORE_PASS is missing."
            missing=1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            missing=1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > app/android/app/upload-keystore.jks

          test -s app/android/app/upload-keystore.jks || {
            echo "ERROR: Keystore was not created."
            exit 1
          }

          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "Signing configuration created."


      # ==================================================
      # 13. RELEASE SIGNING GRADLE CONFIG
      # ==================================================
      - name: Configure Gradle release signing
        shell: bash
        run: |
          set -e

          FILE="app/android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/android/app/build.gradle.kts"
          )

          text = path.read_text(encoding="utf-8")

          imports = """
          import java.util.Properties
          import java.io.FileInputStream

          """

          if "java.util.Properties" not in text:
              text = imports + text

          variables = """
          val keyPropertiesFile =
              rootProject.file("key.properties")

          val keyProperties = Properties()

          if (keyPropertiesFile.exists()) {
              keyProperties.load(
                  FileInputStream(keyPropertiesFile)
              )
          }

          """

          if "val keyPropertiesFile" not in text:
              text = variables + text

          signing = """
              signingConfigs {
                  create("release") {
                      if (keyPropertiesFile.exists()) {
                          storeFile = file(
                              keyProperties["storeFile"] as String
                          )

                          storePassword =
                              keyProperties["storePassword"] as String

                          keyAlias =
                              keyProperties["keyAlias"] as String

                          keyPassword =
                              keyProperties["keyPassword"] as String
                      }
                  }
              }

          """

          marker = "android {"

          if marker not in text:
              raise SystemExit(
                  "ERROR: android block missing."
              )

          pos = text.find(marker)

          insert = pos + len(marker)

          text = (
              text[:insert]
              + "\n"
              + signing
              + text[insert:]
          )

          # Make release use release signing.
          release = text.find("release {")

          if release != -1:
              release_end = release + len("release {")

              if "signingConfig" not in text[release_end:]:
                  text = (
                      text[:release_end]
                      + '\n'
                      + '        signingConfig = '
                      + 'signingConfigs.getByName("release")'
                      + text[release_end:]
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          echo "Release signing configured."


      # ==================================================
      # 14. FINAL GRADLE SANITY CHECK
      # ==================================================
      - name: Final Gradle sanity check
        shell: bash
        run: |
          set -e

          APP="app/android/app/build.gradle.kts"

          echo "Checking Kotlin configuration..."

          if grep -q "kotlinOptions" "$APP"; then
            echo "ERROR: kotlinOptions found."
            grep -n "kotlinOptions" "$APP"
            exit 1
          fi

          if grep -q \
            "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" \
            "$APP"; then
          
