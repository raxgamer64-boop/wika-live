name: Build WikaLive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          cp main.dart app/lib/main.dart

          test -f google-services.json
          cp google-services.json app/android/app/google-services.json

      - name: Configure Firebase Google Services
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          # -----------------------------
          # settings.gradle.kts
          # -----------------------------
          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false''',
                  1
              )

          p.write_text(s)

          # -----------------------------
          # app/build.gradle.kts
          # -----------------------------
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services")''',
                  1
              )

          p.write_text(s)

          # -----------------------------
          # Verify Google Services plugin
          # -----------------------------
          s = p.read_text()

          if 'com.google.gms.google-services' not in s:
              raise SystemExit(
                  "ERROR: Google Services Gradle plugin was not configured."
              )

          # -----------------------------
          # Verify google-services.json
          # -----------------------------
          json_file = Path("android/app/google-services.json")

          if not json_file.exists():
              raise SystemExit(
                  "ERROR: google-services.json is missing."
              )

          import json

          data = json.loads(json_file.read_text())

          clients = data.get("client", [])

          package_found = False
          web_client_found = False

          for client in clients:
              android_info = client.get("client_info", {})
              package_name = android_info.get("android_client_info", {}).get(
                  "package_name"
              )

              if package_name == "com.example.wika_live":
                  package_found = True

              for oauth in client.get("oauth_client", []):
                  if oauth.get("client_type") == 3:
                      web_client_found = True

          if not package_found:
              raise SystemExit(
                  "ERROR: google-services.json does not contain "
                  "Android package com.example.wika_live."
              )

          if not web_client_found:
              raise SystemExit(
                  "ERROR: google-services.json does not contain "
                  "a Web OAuth client (client_type 3)."
              )

          print("Google Services configuration verified.")
          print("Android package: com.example.wika_live")
          print("Web OAuth client: FOUND")
          PY

      - name: Add packages
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker

          # Keep Google Sign-In on the Flutter 7.x API.
          flutter pub add google_sign_in:7.2.0

          # ZEGOCLOUD Live Streaming
          flutter pub add zego_uikit_prebuilt_live_streaming

          flutter pub get

      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASS is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if "import java.util.Properties" not in s:
              s = "import java.util.Properties\n\n" + s

          # Add release signing configuration safely.
          if 'create("release")' not in s:
              signing_block = '''
              signingConfigs {
                  create("release") {
                      val propsFile = rootProject.file("key.properties")
                      val props = Properties()

                      if (propsFile.exists()) {
                          propsFile.inputStream().use {
                              props.load(it)
                          }

                          storeFile =
                              rootProject.file(
                                  props.getProperty("storeFile")
                              )

                          storePassword =
                              props.getProperty("storePassword")

                          keyAlias =
                              props.getProperty("keyAlias")

                          keyPassword =
                              props.getProperty("keyPassword")
                      }
                  }
              }
          '''

              s = s.replace(
                  "android {",
                  "android {" + signing_block,
                  1
              )

          # Attach release signing config.
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace(
                  'release {',
                  '''release {
              signingConfig =
                  signingConfigs.getByName("release")''',
                  1
              )

          p.write_text(s)
          PY

          echo "Android release signing configured."

      - name: Verify Android configuration
        working-directory: app
        run: |
          set -e

          echo "Checking Android package..."

          grep -n "namespace" android/app/build.gradle.kts || true

          echo "Checking Google Services..."

          test -f android/app/google-services.json

          echo "Checking signing keystore..."

          test -f android/app/upload-keystore.jks
          test -f android/key.properties

          echo "Android configuration OK."

      - name: Analyze Dart
        working-directory: app
        run: |
          set -e
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo "ERROR: ZEGO_APP_SIGN GitHub Secret is missing."
            exit 1
          fi

          flutter clean
          flutter pub get

          echo "========================================"
          echo "Building WikaLive RELEASE APK"
          echo "Google Sign-In: Firebase"
          echo "ZEGOCLOUD: Enabled"
          echo "Release Signing: Enabled"
          echo "========================================"

          flutter build apk \
            --release \
            --dart-define=ZEGO_APP_SIGN="$ZEGO_APP_SIGN"

      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "WikaLive APK CREATED"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
