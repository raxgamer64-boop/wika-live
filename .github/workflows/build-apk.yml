name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true


      # =========================================================
      # 3. CREATE FLUTTER PROJECT
      # =========================================================
      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            app

          test -f main.dart || {
            echo "ERROR: main.dart is missing."
            exit 1
          }

          test -d assets/live_ui || {
            echo "ERROR: assets/live_ui is missing."
            exit 1
          }

          mkdir -p app/lib
          mkdir -p app/assets

          cp main.dart app/lib/main.dart
          cp -R assets/live_ui app/assets/live_ui

          echo "=========================================="
          echo "WikaLive source copied"
          echo "=========================================="

          echo "main.dart:"
          ls -lh app/lib/main.dart

          echo ""
          echo "Live UI assets:"
          find app/assets/live_ui \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


      # =========================================================
      # 4. KOTLIN + GRADLE + JAVA COMPATIBILITY
      # =========================================================
      - name: Configure Android Kotlin and Java
        shell: bash
        run: |
          set -e

          SETTINGS="app/android/settings.gradle.kts"
          APP_GRADLE="app/android/app/build.gradle.kts"
          GRADLE_PROPERTIES="app/android/gradle.properties"

          test -f "$SETTINGS" || {
            echo "ERROR: settings.gradle.kts missing."
            exit 1
          }

          test -f "$APP_GRADLE" || {
            echo "ERROR: app/build.gradle.kts missing."
            exit 1
          }

          # -----------------------------------------------------
          # Kotlin 2.3.0
          # -----------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # Replace existing Kotlin Android plugin version.
          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"',
              'id("org.jetbrains.kotlin.android") version "2.3.0"',
              text
          )

          # Add Kotlin plugin if it doesn't exist.
          if 'id("org.jetbrains.kotlin.android")' not in text:
              marker = "plugins {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: plugins block missing in settings.gradle.kts"
                  )

              text = text.replace(
                  marker,
                  marker +
                  '\n    id("org.jetbrains.kotlin.android") version "2.3.0"',
                  1
              )

          path.write_text(text, encoding="utf-8")
          PY

          # -----------------------------------------------------
          # Android Gradle Plugin
          # -----------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'id\("com\.android\.application"\)\s+version\s+"[^"]+"',
              'id("com.android.application") version "8.7.3"',
              text
          )

          path.write_text(text, encoding="utf-8")
          PY

          # -----------------------------------------------------
          # Remove ALL old kotlinOptions blocks.
          # Add Kotlin 2.3 compilerOptions DSL.
          # -----------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # Remove every old kotlinOptions block.
          text = re.sub(
              r'\n[ \t]*kotlinOptions\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.S
          )

          # Remove any previously inserted compilerOptions/kotlin block
          # from earlier workflow attempts so we never stack blocks.
          text = re.sub(
              r'\n[ \t]*kotlin\s*\{\s*compilerOptions\s*\{.*?\n[ \t]*\}\s*\}',
              '',
              text,
              flags=re.S
          )

          # Remove previously added Java compile blocks if present.
          text = re.sub(
              r'\n[ \t]*compileOptions\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.S
          )

          # Add the required import.
          if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in text:
              text = (
                  'import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n'
                  + text
              )

          # Java 17.
          compile_block = r'''
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          '''

          # We will insert compileOptions inside the existing android block
          # instead of creating a second android block.
          android_marker = "android {"

          if android_marker not in text:
              raise SystemExit(
                  "ERROR: android block missing in app/build.gradle.kts"
              )

          android_pos = text.find(android_marker)
          android_insert = android_pos + len(android_marker)

          text = (
              text[:android_insert]
              + r'''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              '''
              + text[android_insert:]
          )

          # Kotlin 2.3 compilerOptions.
          kotlin_block = r'''
          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }

          '''

          text = kotlin_block + text

          path.write_text(text, encoding="utf-8")
          PY

          # -----------------------------------------------------
          # Gradle properties
          # -----------------------------------------------------
          touch "$GRADLE_PROPERTIES"

          grep -q '^android.useAndroidX=true' \
            "$GRADLE_PROPERTIES" || \
            echo 'android.useAndroidX=true' >> "$GRADLE_PROPERTIES"

          grep -q '^android.enableJetifier=true' \
            "$GRADLE_PROPERTIES" || \
            echo 'android.enableJetifier=true' >> "$GRADLE_PROPERTIES"

          echo ""
          echo "=========================================="
          echo "KOTLIN CONFIGURATION"
          echo "=========================================="

          grep -n "kotlin" "$SETTINGS" || true

          echo ""
          echo "=========================================="
          echo "JVM CONFIGURATION"
          echo "=========================================="

          grep -n \
            -E "compilerOptions|jvmTarget|sourceCompatibility|targetCompatibility|kotlinOptions" \
            "$APP_GRADLE" || true

          # IMPORTANT: old kotlinOptions must NOT remain.
          if grep -q "kotlinOptions" "$APP_GRADLE"; then
            echo "ERROR: Old kotlinOptions still exists."
            exit 1
          fi

          echo ""
          echo "Kotlin/Java configuration verified."


      # =========================================================
      # 5. FIREBASE
      # =========================================================
      - name: Configure Firebase
        shell: bash
        run: |
          set -e

          test -f google-services.json || {
            echo "ERROR: google-services.json missing."
            exit 1
          }

          mkdir -p app/android/app

          cp google-services.json \
            app/android/app/google-services.json

          echo "Firebase configuration copied."


      # =========================================================
      # 6. GOOGLE SERVICES GRADLE PLUGIN
      # =========================================================
      - name: Configure Google Services
        shell: bash
        run: |
          set -e

          SETTINGS="app/android/settings.gradle.kts"
          APP_GRADLE="app/android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          # settings.gradle.kts
          path = Path("app/android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")

          plugin_line = (
              'id("com.google.gms.google-services") '
              'version "4.4.3" apply false'
          )

          if 'id("com.google.gms.google-services")' not in text:
              marker = "plugins {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: plugins block missing."
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + plugin_line,
                  1
              )

          path.write_text(text, encoding="utf-8")

          # app/build.gradle.kts
          path = Path("app/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if 'id("com.google.gms.google-services")' not in text:
              marker = "plugins {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: app plugins block missing."
                  )

              text = text.replace(
                  marker,
                  marker +
                  '\n    id("com.google.gms.google-services")',
                  1
              )

          path.write_text(text, encoding="utf-8")
          PY

          echo "Google Services plugin configured."


      # =========================================================
      # 7. ANDROID PERMISSIONS
      # =========================================================
      - name: Configure Android permissions
        shell: bash
        run: |
          set -e

          MANIFEST="app/android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST" || {
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
          ]

          marker = "<application"

          additions = ""

          for permission in permissions:
              if permission not in text:
                  additions += "    " + permission + "\n"

          if additions and marker in text:
              text = text.replace(
                  marker,
                  additions + "\n    " + marker,
                  1
              )

          path.write_text(text, encoding="utf-8")
          PY

          echo "Android permissions configured."


      # =========================================================
      # 8. FLUTTER DEPENDENCIES
      # =========================================================
      - name: Configure Flutter dependencies
        working-directory: app
        shell: bash
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          flutter pub get


      # =========================================================
      # 9. LIVE UI ASSETS
      # =========================================================
      - name: Configure live UI assets
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")

          if "    - assets/live_ui/" not in text:

              lines = text.splitlines(True)

              flutter_indexes = []

              for i, line in enumerate(lines):
                  if re.match(r"^flutter:\s*$", line):
                      flutter_indexes.append(i)

              if not flutter_indexes:
                  raise SystemExit(
                      "ERROR: root flutter section missing."
                  )

              idx = flutter_indexes[-1]
              insert_at = idx + 1

              while insert_at < len(lines):
                  line = lines[insert_at]

                  if line.strip() and not line.startswith(" "):
                      break

                  insert_at += 1

              lines[insert_at:insert_at] = [
                  "\n",
                  "  assets:\n",
                  "    - assets/live_ui/\n",
              ]

              path.write_text(
                  "".join(lines),
                  encoding="utf-8"
              )

          print("live_ui assets configured.")
          PY

          flutter pub get


      # =========================================================
      # 10. VERIFY ASSETS
      # =========================================================
      - name: Verify live UI assets
        shell: bash
        run: |
          set -e

          REQUIRED_ASSETS=(
            "logo.png"
            "ic_guardian_gold.png"
            "ic_guardian_diamond.png"
            "iv_gift_btn.png"
            "iv_live_rule_logo.png"
            "iv_live_team_pk_blue_seat.png"
            "iv_live_team_pk_red_seat.png"
            "iv_lucky_button.png"
            "iv_quick_gift.png"
            "bg_treasure_box.png"
          )

          for FILE in "${REQUIRED_ASSETS[@]}"; do
            test -f "app/assets/live_ui/$FILE" || {
              echo "ERROR: Missing asset: $FILE"
              exit 1
            }
          done

          echo "All live UI assets verified."


      # =========================================================
      # 11. VERIFY FIREBASE PROJECT
      # =========================================================
      - name: Verify Firebase project
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "app/android/app/google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          project_id = (
              data
              .get("project_info", {})
              .get("project_id")
          )

          print("Firebase project:", project_id)

          if project_id != "wika-live":
              raise SystemExit(
                  "ERROR: Firebase project must be wika-live."
              )
          PY


      # =========================================================
      # 12. VERIFY PACKAGE
      # =========================================================
      - name: Verify Android package
        shell: bash
        run: |
          set -e

          MANIFEST="app/android/app/src/main/AndroidManifest.xml"
          GRADLE="app/android/app/build.gradle.kts"

          echo "Checking generated Android configuration..."

          grep -n "namespace" "$GRADLE" || true
          grep -n "applicationId" "$GRADLE" || true

          echo "Android configuration checked."


      # =========================================================
      # 13. RELEASE SIGNING
      # =========================================================
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking signing secrets..."

          missing=0

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            missing=1
          fi

          if [ -z "$KEYSTORE_PASS" ]; then
            echo "ERROR: KEYSTORE_PASS is missing."
            missing=1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            missing=1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > app/android/app/upload-keystore.jks

          test -s app/android/app/upload-keystore.jks || {
            echo "ERROR: Keystore file was not created."
            exit 1
          }

          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "Signing configuration created successfully."


      # =========================================================
      # 14. RELEASE SIGNING CONFIG
      # =========================================================
      - name: Configure Gradle release signing
        shell: bash
        run: |
          set -e

          FILE="app/android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/android/app/build.gradle.kts"
          )

          text = path.read_text(encoding="utf-8")

          # Remove any previous signingConfigs block generated
          # by an earlier version of this workflow.
          text = re.sub(
              r'\n[ \t]*signingConfigs\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.S
          )

          signing_import = """
          import java.util.Properties
          import java.io.FileInputStream
          """

          if "java.util.Properties" not in text:
              text = signing_import + "\n" + text

          signing_variables = r'''
          val keyPropertiesFile =
              rootProject.file("key.properties")

          val keyProperties = Properties()

          if (keyPropertiesFile.exists()) {
              keyProperties.load(
                  FileInputStream(keyPropertiesFile)
              )
          }

          '''

          if "val keyPropertiesFile" not in text:
              text = signing_variables + text

          signing_block = r'''
              signingConfigs {
                  create("release") {
                      if (keyPropertiesFile.exists()) {
                          storeFile = file(
                              keyProperties["storeFile"] as String
                          )

                          storePassword =
                              keyProperties["storePassword"] as String

                          keyAlias =
                              keyProperties["keyAlias"] as String

                          keyPassword =
                              keyProperties["keyPassword"] as String
                      }
                  }
              }

          '''

          android_marker = "android {"

          if android_marker not in text:
              raise SystemExit(
                  "ERROR: android block missing."
              )

          pos = text.find(android_marker)

          insert_pos = pos + len(android_marker)

          text = (
              text[:insert_pos]
              + "\n"
              + signing_block
              + text[insert_pos:]
          )

          # Replace debug signing on release if present.
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          # Add release signing if release block exists and doesn't
          # already contain a signingConfig.
          release_match = re.search(
              r'release\s*\{',
              text
          )

          if release_match:
              release_start = release_match.end()

              remaining = text[release_start:]

              if "signingConfig" not in remaining:
                  text = (
                      text[:release_start]
                      + '\n'
                      + '        signingConfig = '
                      + 'signingConfigs.getByName("release")'
                      + text[release_start:]
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          echo "Release signing configured."


      # =========================================================
      # 15. FINAL KOTLIN SANITY CHECK
      # =========================================================
      - name: Verify Kotlin compiler configuration
        shell: bash
        run: |
          set -e

          FILE="app/android/app/build.gradle.kts"

          echo "=========================================="
          echo "KOTLIN SANITY CHECK"
          echo "=========================================="

          if grep -q "kotlinOptions" "$FILE"; then
            echo "ERROR: kotlinOptions is still present."
            grep -n "kotlinOptions" "$FILE"
            exit 1
          fi

          grep -n "compilerOptions" "$FILE" || {
            echo "ERROR: compilerOptions not found."
            exit 1
          }

          grep -n "JvmTarget.JVM_17" "$FILE" || {
            echo "ERROR: JVM 17 target not found."
            exit 1
          }

          grep -n "VERSION_17" "$FILE" || {
            echo "ERROR: Java 17 configuration not found."
            exit 1
          }

          echo ""
          echo "Kotlin compiler configuration is valid."


      # =========================================================
      # 16. FLUTTER ANALYZE
      # =========================================================
      - name: Flutter analyze
        working-directory: app
        shell: bash
        run: |
          set +e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

          ANALYZE_EXIT=$?

          echo ""
          echo "Flutter analyze exit code: $ANALYZE_EXIT"
          echo "Info/warning findings will not stop the APK build."

          exit 0


      # =========================================================
      # 17. BUILD RELEASE APK
      # =========================================================
      - name: Build release APK
        working-directory: app
        shell: bash
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo "ERROR: ZEGO_APP_SIGN secret is missing."
            exit 1
          fi

          flutter build apk \
            --release \
            --dart-define=ZEGO_APP_SIGN="$ZEGO_APP_SIGN"

          test -f \
            build/app/outputs/flutter-apk/app-release.apk || {
              echo "ERROR: APK was not generated."
              exit 1
          }

          echo "=========================================="
          echo "RELEASE APK CREATED"
          echo "=========================================="

          ls -lh \
            build/app/outputs/flutter-apk/app-release.apk


      # =========================================================
      # 18. BUILD RELEASE AAB
      # =========================================================
      - name: Build release AAB
        working-directory: app
        shell: bash
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo "ERROR: ZEGO_APP_SIGN secret is missing."
            exit 1
          fi

          flutter build appbundle \
            --release \
            --dart-define=ZEGO_APP_SIGN="$ZEGO_APP_SIGN"

          test -f \
            build/app/outputs/bundle/release/app-release.aab || {
              echo "ERROR: AAB was not generated."
              exit 1
          }

          echo "=========================================="
          echo "RELEASE AAB CREATED"
          echo "=========================================="

          ls -lh \
            build/app/outputs/bundle/release/app-release.aab


      # =========================================================
      # 19. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK size:"
          ls -lh "$APK"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"


      # =========================================================
      # 20. VERIFY AAB
      # =========================================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="app/build/app/outputs/bundle/release/app-release.aab"

          test -f "$AAB"

          echo "AAB size:"
          ls -lh "$AAB"

          echo ""
          echo "AAB SHA256:"
          sha256sum "$AAB"


      # =========================================================
      # 21. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


      # =========================================================
      # 22. UPLOAD AAB
      # =========================================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      # =========================================================
      # 23. FINAL
      # =========================================================
      - name: Build completed
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       WIKALIVE BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK:"
          echo "WikaLive-release-apk"
          echo ""
          echo "AAB:"
          echo "WikaLive-release-aab"
          echo ""
          echo "=========================================="
