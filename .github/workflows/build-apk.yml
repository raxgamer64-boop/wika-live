name: Build WikaLive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          set -e
          rm -rf app
          flutter create --project-name wika_live app

          cp main.dart app/lib/main.dart

          mkdir -p app/android/app
          cp google-services.json app/android/app/google-services.json

          test -f app/lib/main.dart
          test -f app/android/app/google-services.json

      - name: Configure Firebase and Signing
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          # 1. Update settings.gradle.kts
          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()
          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.3" apply false',
                  1,
              )
              settings.write_text(text)

          # 2. Overwrite app/build.gradle.kts with correct configuration
          build_gradle_content = textwrap.dedent("""
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
              id("com.google.gms.google-services")
          }

          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.example.wika_live"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_11.toString()
              }

              defaultConfig {
                  applicationId = "com.example.wika_live"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          """)

          Path("android/app/build.gradle.kts").write_text(build_gradle_content)
          PY

          test -f android/app/google-services.json

      - name: Get packages
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0

          flutter pub get

      - name: Add game assets
        working-directory: app
        run: |
          set -e

          if [ -d ../assets/games ]; then
            mkdir -p assets/games
            cp -r ../assets/games/. assets/games/

            sed -i '/^  uses-material-design: true$/a\
          assets:\
            - assets/games/' pubspec.yaml
          fi

          echo "======================================"
          echo "FINAL PUBSPEC"
          echo "======================================"
          cat pubspec.yaml

          flutter pub get

      - name: Setup Release Keystore
        working-directory: app/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > wika-release-key.jks
          cat > key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=wika-release-key.jks
          EOF

      - name: Show Release SHA-1
        working-directory: app/android
        run: |
          set -e
          echo "======================================"
          echo "WIKALIVE RELEASE SHA-1"
          echo "======================================"
          keytool -list -v -keystore wika-release-key.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} -alias ${{ secrets.KEY_ALIAS }}

      - name: Verify Firebase JSON
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "app/android/app/google-services.json"

          with open(path, "r") as f:
              data = json.load(f)

          found = False

          for client in data.get("client", []):
              package = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package == "com.example.wika_live":
                  found = True
                  break

          if not found:
              raise SystemExit(
                  "ERROR: com.example.wika_live not found in google-services.json"
              )

          print("Firebase JSON verification successful.")
          PY

      - name: Analyze
        working-directory: app
        run: |
          flutter analyze || true

      - name: Build Release APK
        working-directory: app
        run: |
          set -e

          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "WIKALIVE APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
