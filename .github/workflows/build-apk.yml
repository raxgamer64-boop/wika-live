name: Build WikaLive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create Flutter project
        run: |
          rm -rf wika_build
          flutter create \
            --org com.example \
            --project-name wika_live \
            wika_build

      - name: Copy WikaLive files
        run: |
          cp main.dart wika_build/lib/main.dart

          mkdir -p wika_build/android/app

          if [ -f google-services.json ]; then
            cp google-services.json wika_build/android/app/google-services.json
          else
            echo "ERROR: google-services.json not found"
            exit 1
          fi

          if [ -d assets/games ]; then
            mkdir -p wika_build/assets/games
            cp -r assets/games/. wika_build/assets/games/
          fi

      - name: Create pubspec.yaml
        working-directory: wika_build
        run: |
          cat > pubspec.yaml <<'EOF'
          name: wika_live
          description: Wika Live App
          publish_to: "none"

          version: 1.0.0+1

          environment:
            sdk: ">=3.5.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            firebase_core: ^4.15.0
            firebase_auth: ^6.7.0
            cloud_firestore: ^6.10.0
            firebase_storage: ^13.6.0
            image_picker: ^1.2.3
            google_sign_in: ^7.2.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/games/
          EOF

          echo "======================================"
          echo "PUBSPEC.YAML"
          echo "======================================"
          cat pubspec.yaml

      - name: Configure Google Services
        working-directory: wika_build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1
              )
              settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )
              app.write_text(text)
          PY

          test -f android/app/google-services.json

      - name: Get packages
        working-directory: wika_build
        run: |
          flutter pub get

      - name: Analyze
        working-directory: wika_build
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: wika_build
        run: |
          flutter build apk --release

      - name: Verify APK
        working-directory: wika_build
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: wika_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
