name: Build WikaLive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --project-name wika_live app
          cp main.dart app/lib/main.dart
          cp google-services.json app/android/app/google-services.json

      - name: Configure Firebase
        run: |
          cd app

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.3" apply false',
                  1
              )
              settings.write_text(text)

          build = Path("android/app/build.gradle.kts")
          text = build.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )
              build.write_text(text)
          PY

      - name: Get packages
        run: |
          cd app
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add google_sign_in:6.3.0
          flutter pub get

      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore app/android/app/upload-keystore.jks \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=WikaLive, OU=WikaLive, O=WikaLive, L=India, ST=Jharkhand, C=IN"

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/android/app/build.gradle.kts")
          text = p.read_text()

          text = text.replace(
              'android {',
              '''android {
              signingConfigs {
                  create("release") {
                      storeFile = file("upload-keystore.jks")
                      storePassword = "android"
                      keyAlias = "upload"
                      keyPassword = "android"
                  }
              }''',
              1
          )

          text = text.replace(
              'release {',
              '''release {
                  signingConfig = signingConfigs.getByName("release")''',
              1
          )

          p.write_text(text)
          PY

      - name: Verify Firebase config
        run: |
          test -f app/android/app/google-services.json
          echo "Firebase config found."

      - name: Build APK
        run: |
          cd app
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Get SHA fingerprints
        run: |
          echo "======================================"
          echo "WikaLive RELEASE KEY SHA FINGERPRINTS"
          echo "======================================"

          keytool -list -v \
            -keystore app/android/app/upload-keystore.jks \
            -storepass android \
            -alias upload \
            | grep -E "SHA1:|SHA256:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-APK-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
