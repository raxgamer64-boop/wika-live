name: Build WikaLive APK

on:
  workflow_dispatch:

    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          set -e
          rm -rf app
          flutter create --project-name wika_live app

          cp main.dart app/lib/main.dart

          mkdir -p app/android/app
          cp google-services.json app/android/app/google-services.json

          test -f app/lib/main.dart
          test -f app/android/app/google-services.json

      - name: Configure Firebase
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.3" apply false',
                  1,
              )
              settings.write_text(text)

          build = Path("android/app/build.gradle.kts")
          text = build.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )
              build.write_text(text)
          PY

          test -f android/app/google-services.json

      - name: Get packages
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0

          flutter pub get

      - name: Add game assets
        working-directory: app
        run: |
          set -e

          if [ -d ../assets/games ]; then
            mkdir -p assets/games
            cp -r ../assets/games/. assets/games/

            sed -i '/^  uses-material-design: true$/a\
          assets:\
            - assets/games/' pubspec.yaml
          fi

          echo "======================================"
          echo "FINAL PUBSPEC"
          echo "======================================"
          cat pubspec.yaml

          flutter pub get

      - name: Prepare Android Debug Keystore
        working-directory: app/android
        run: |
          set -e

          mkdir -p "$HOME/.config/.android"

          if [ ! -f "$HOME/.config/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.config/.android/debug.keystore" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show Android SHA-1
        working-directory: app/android
        run: |
          set -e
          echo "======================================"
          echo "WIKALIVE ANDROID SHA-1"
          echo "======================================"
          ./gradlew signingReport

      - name: Verify Firebase JSON
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "app/android/app/google-services.json"

          with open(path, "r") as f:
              data = json.load(f)

          found = False

          for client in data.get("client", []):
              package = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package == "com.example.wika_live":
                  found = True
                  break

          if not found:
              raise SystemExit(
                  "ERROR: com.example.wika_live not found in google-services.json"
              )

          print("Firebase JSON verification successful.")
          PY

      - name: Analyze
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        working-directory: app
        run: |
          set -e

          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "WIKALIVE APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
