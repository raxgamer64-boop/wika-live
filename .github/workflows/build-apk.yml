name: Build WikaLive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          cp main.dart app/lib/main.dart

          test -f google-services.json
          cp google-services.json app/android/app/google-services.json

          echo "Flutter project created."

      - name: Configure Android
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # =====================================================
          # settings.gradle.kts
          # =====================================================

          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          # Kotlin 2.3.21
          s = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false',
              s,
              count=1
          )

          if 'org.jetbrains.kotlin.android' not in s:
              s = s.replace(
                  "plugins {",
                  '''plugins {
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false''',
                  1
              )

          # Google Services
          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  "plugins {",
                  '''plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false''',
                  1
              )

          p.write_text(s)

          # =====================================================
          # app/build.gradle.kts
          # =====================================================

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Google Services plugin
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  '''plugins {
              id("com.google.gms.google-services")''',
                  1
              )

          # -----------------------------------------------------
          # REMOVE OLD Kotlin jvmTarget DSL
          # -----------------------------------------------------

          s = re.sub(
              r'\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.DOTALL
          )

          s = re.sub(
              r'\s*jvmTarget\s*=\s*JavaVersion\.VERSION_\d+\.toString\(\)',
              '',
              s
          )

          s = re.sub(
              r'\s*jvmTarget\s*=\s*"[^"]+"',
              '',
              s
          )

          # Remove any old compilerOptions block so we create
          # exactly one clean block below.
          s = re.sub(
              r'\n\s*kotlin\s*\{\s*compilerOptions\s*\{.*?\}\s*\}',
              '',
              s,
              flags=re.DOTALL
          )

          # =====================================================
          # JAVA 17
          # =====================================================

          s = s.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          # =====================================================
          # RELEASE SIGNING
          # =====================================================

          if "create(\"release\")" not in s:
              signing = '''

          signingConfigs {
              create("release") {
                  val propsFile = rootProject.file("key.properties")
                  val props = Properties()

                  if (propsFile.exists()) {
                      propsFile.inputStream().use {
                          props.load(it)
                      }

                      storeFile =
                          rootProject.file(
                              props.getProperty("storeFile")
                          )

                      storePassword =
                          props.getProperty("storePassword")

                      keyAlias =
                          props.getProperty("keyAlias")

                      keyPassword =
                          props.getProperty("keyPassword")
                  }
              }
          }
          '''

              s = s.replace(
                  "buildTypes {",
                  signing + "\nbuildTypes {",
                  1
              )

          # Release signing
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace(
                  "release {",
                  '''release {
                      signingConfig =
                          signingConfigs.getByName("release")''',
                  1
              )

          # =====================================================
          # CLEAN KOTLIN 2.3 COMPILER OPTIONS
          # =====================================================

          s += '''

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          '''

          p.write_text(s)

          # =====================================================
          # FINAL CHECK
          # =====================================================

          final = p.read_text()

          if "jvmTarget = JavaVersion.VERSION_17.toString()" in final:
              raise SystemExit(
                  "ERROR: Old jvmTarget syntax still exists."
              )

          if "kotlinOptions" in final:
              raise SystemExit(
                  "ERROR: Old kotlinOptions block still exists."
              )

          if "jvmTarget.set(" not in final:
              raise SystemExit(
                  "ERROR: New compilerOptions JVM target missing."
              )

          print("==========================================")
          print("ANDROID CONFIGURATION")
          print("==========================================")
          print("Kotlin: 2.3.21")
          print("JVM Target: JVM_17")
          print("Old kotlinOptions: REMOVED")
          print("New compilerOptions DSL: ENABLED")
          print("Google Services: ENABLED")
          print("Release signing: CONFIGURED")
          print("==========================================")
          PY

      - name: Add packages
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming

          flutter pub get

      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASS is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          test -s android/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "Release signing ready."

      - name: Verify Google Services
        working-directory: app
        run: |
          set -e

          test -f android/app/google-services.json

          python3 - <<'PY'
          import json

          with open("android/app/google-services.json") as f:
              data = json.load(f)

          clients = data.get("client", [])

          package_found = False
          web_oauth_found = False

          for client in clients:
              info = client.get("client_info", {})

              android = info.get(
                  "android_client_info",
                  {}
              )

              if android.get("package_name") == "com.example.wika_live":
                  package_found = True

              for oauth in client.get("oauth_client", []):
                  if oauth.get("client_type") == 3:
                      web_oauth_found = True

          if not package_found:
              raise SystemExit(
                  "ERROR: Android package com.example.wika_live "
                  "not found in google-services.json."
              )

          if not web_oauth_found:
              raise SystemExit(
                  "ERROR: Web OAuth client not found "
                  "in google-services.json."
              )

          print("Google Services: OK")
          print("Android package: com.example.wika_live")
          print("Web OAuth client: FOUND")
          PY

      - name: Analyze Dart
        working-directory: app
        run: |
          set -e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build release APK
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo "ERROR: ZEGO_APP_SIGN GitHub Secret is missing."
            exit 1
          fi

          flutter clean
          flutter pub get

          echo "=========================================="
          echo "BUILDING WIKALIVE RELEASE APK"
          echo "=========================================="
          echo "Flutter: 3.35.4"
          echo "Kotlin: 2.3.21"
          echo "JVM: 17"
          echo "Google Sign-In: 7.2.0"
          echo "Firebase: ENABLED"
          echo "ZEGOCLOUD: ENABLED"
          echo "Signing: ENABLED"
          echo "=========================================="

          flutter build apk \
            --release \
            --dart-define=ZEGO_APP_SIGN="$ZEGO_APP_SIGN"

      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "=========================================="
          echo "WIKALIVE APK SUCCESSFULLY CREATED"
          echo "=========================================="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
