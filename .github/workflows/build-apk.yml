name: Build WikaLive APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          set -e

          flutter create \
            --org com.example \
            --project-name wika_live \
            app

      - name: Configure Android Kotlin
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------------------------------------
          # settings.gradle.kts
          # ---------------------------------------
          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          # Kotlin 2.4.20
          if 'id("org.jetbrains.kotlin.android")' in s:
              s = re.sub(
                  r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
                  r'\g<1>2.4.20\g<2>',
                  s,
              )
          else:
              s = s.replace(
                  'plugins {',
                  'plugins {\n'
                  '    id("org.jetbrains.kotlin.android") '
                  'version "2.4.20" apply false',
                  1,
              )

          # Google services plugin
          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  'plugins {',
                  'plugins {\n'
                  '    id("com.google.gms.google-services") '
                  'version "4.4.2" apply false',
                  1,
              )

          p.write_text(s)

          # ---------------------------------------
          # app/build.gradle.kts
          # ---------------------------------------
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Properties import
          if "import java.util.Properties" not in s:
              s = "import java.util.Properties\n\n" + s

          # Google services plugin
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  'plugins {',
                  'plugins {\n'
                  '    id("com.google.gms.google-services")',
                  1,
              )

          # ---------------------------------------
          # Remove old Kotlin jvmTarget DSL
          # ---------------------------------------
          s = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?jvmTarget\s*=\s*JavaVersion\.VERSION_11\.toString\(\).*?\}',
              '',
              s,
              flags=re.DOTALL,
          )

          # Remove any remaining simple jvmTarget assignment
          s = re.sub(
              r'\n\s*jvmTarget\s*=\s*[^\n]+',
              '',
              s,
          )

          # ---------------------------------------
          # Add new Kotlin compilerOptions DSL
          # ---------------------------------------
          if "compilerOptions {" not in s:
              compiler_block = '''
              
              kotlin {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
                      )
                  }
              }
              
              '''

              # Put it before android {
              s = s.replace(
                  'android {',
                  compiler_block + '\nandroid {',
                  1,
              )

          p.write_text(s)

          print("Kotlin 2.4.20 configured.")
          print("New compilerOptions DSL configured.")
          PY

          echo "---- Kotlin plugin ----"
          grep -n "org.jetbrains.kotlin.android" \
            android/settings.gradle.kts || true

          echo "---- compilerOptions ----"
          grep -n -A8 -B2 "compilerOptions" \
            android/app/build.gradle.kts || true

      - name: Copy app files
        run: |
          set -e

          test -f main.dart
          cp main.dart app/lib/main.dart

          test -f google-services.json
          mkdir -p app/android/app
          cp google-services.json app/android/app/google-services.json

      - name: Add packages
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0

          flutter pub get

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          MISSING=0

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 set: false"
            MISSING=1
          else
            echo "KEYSTORE_BASE64 set: true"
          fi

          if [ -z "${STORE_PASS:-}" ]; then
            echo "STORE_PASS set: false"
            MISSING=1
          else
            echo "STORE_PASS set: true"
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "KEY_ALIAS set: false"
            MISSING=1
          else
            echo "KEY_ALIAS set: true"
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "KEY_PASSWORD set: false"
            MISSING=1
          else
            echo "KEY_PASSWORD set: true"
          fi

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "ERROR: One or more Android signing secrets are missing."
            exit 1
          fi

          echo ""
          echo "All Android signing secrets are available."

      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release-key.jks

          test -s android/app/release-key.jks

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-key.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Release signing configuration
          if 'create("release")' not in s:
              signing_block = '''
              
              signingConfigs {
                  create("release") {
                      val propsFile = rootProject.file("key.properties")
                      val props = Properties()

                      if (propsFile.exists()) {
                          propsFile.inputStream().use {
                              props.load(it)
                          }
                      }

                      storeFile = file(
                          props["storeFile"]?.toString()
                              ?: "release-key.jks"
                      )

                      storePassword =
                          props["storePassword"]?.toString()

                      keyAlias =
                          props["keyAlias"]?.toString()

                      keyPassword =
                          props["keyPassword"]?.toString()
                  }
              }
              
              '''

              s = s.replace(
                  'android {',
                  'android {\n' + signing_block,
                  1,
              )

          # Release build uses signing config
          if 'signingConfigs.getByName("release")' not in s:
              release_block = '''
              
                  getByName("release") {
                      signingConfig =
                          signingConfigs.getByName("release")
                  }
              
              '''

              s = s.replace(
                  'buildTypes {',
                  'buildTypes {\n' + release_block,
                  1,
              )

          p.write_text(s)
          PY

          echo "Release signing configured."

          echo "Checking keystore..."

          keytool -list \
            -keystore android/app/release-key.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS"

          echo "Keystore verification successful."

      - name: Analyze Dart
        working-directory: app
        run: |
          set -e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build release APK
        working-directory: app
        run: |
          set -e

          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          test -f app/build/app/outputs/flutter-apk/app-release.apk

          ls -lh \
            app/build/app/outputs/flutter-apk/app-release.apk

          echo "APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
