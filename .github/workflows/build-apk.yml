name: Build WikaLive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        run: |
          set -e

          rm -rf app

          flutter create --project-name wika_live app

          cp main.dart app/lib/main.dart
          cp google-services.json app/android/app/google-services.json

          mkdir -p app/assets/games

          if [ -d assets/games ]; then
            cp -r assets/games/. app/assets/games/
            echo "Game assets copied."
          else
            echo "No game assets folder found."
          fi

          test -f app/lib/main.dart
          test -f app/android/app/google-services.json

          echo "main.dart FOUND"
          echo "google-services.json FOUND"


      # ==========================================
      # 4. CONFIGURE FIREBASE
      # ==========================================
      - name: Configure Firebase
        run: |
          set -e

          cd app

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          build = Path("android/app/build.gradle.kts")

          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false
              """,
                  1
              )

          settings.write_text(text)

          text = build.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services")
              """,
                  1
              )

          build.write_text(text)

          print("Firebase Google Services configured.")
          PY

          test -f android/app/google-services.json


      # ==========================================
      # 5. CONFIGURE DEPENDENCIES
      # ==========================================
      - name: Configure Flutter dependencies
        run: |
          set -e

          cd app

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          text = p.read_text()

          dependencies = """
            firebase_core: ^4.15.0
            firebase_auth: ^6.7.0
            cloud_firestore: ^6.10.0
            firebase_storage: ^13.6.0
            image_picker: ^1.2.3
            google_sign_in: ^7.2.0
          """.rstrip()

          # Remove any dependency lines that may already exist.
          names = [
              "firebase_core",
              "firebase_auth",
              "cloud_firestore",
              "firebase_storage",
              "image_picker",
              "google_sign_in",
          ]

          for name in names:
              text = re.sub(
                  rf"(?m)^    {re.escape(name)}:.*\n",
                  "",
                  text
              )

          marker = "dependencies:\n"

          if marker not in text:
              raise SystemExit(
                  "ERROR: dependencies section not found."
              )

          text = text.replace(
              marker,
              marker + dependencies + "\n",
              1
          )

          # Register game artwork.
          if "    - assets/games/" not in text:
              flutter_marker = "flutter:\n"

              if flutter_marker not in text:
                  raise SystemExit(
                      "ERROR: flutter section not found."
                  )

              text = text.replace(
                  flutter_marker,
                  "flutter:\n  assets:\n    - assets/games/\n",
                  1
              )

          p.write_text(text)

          print("Dependencies configured.")
          print("Game assets configured.")
          PY

          echo "======================================"
          echo "PUBSPEC"
          echo "======================================"

          cat pubspec.yaml

          echo "======================================"
          echo "FLUTTER PUB GET"
          echo "======================================"

          flutter pub get


      # ==========================================
      # 6. VERIFY FIREBASE
      # ==========================================
      - name: Verify Firebase JSON
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "app/android/app/google-services.json"

          with open(path, "r") as f:
              data = json.load(f)

          project_id = data["project_info"]["project_id"]

          print("Firebase Project:", project_id)

          found = False

          for client in data.get("client", []):
              package = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package == "com.example.wika_live":
                  found = True
                  print("Package: com.example.wika_live")

          if not found:
              raise SystemExit(
                  "ERROR: com.example.wika_live not found in google-services.json"
              )

          print("Firebase verification successful.")
          PY


      # ==========================================
      # 7. VERIFY GAME ASSETS
      # ==========================================
      - name: Verify Game Assets
        run: |
          set -e

          cd app

          echo "======================================"
          echo "GAME ASSETS"
          echo "======================================"

          if [ -d assets/games ]; then
            COUNT=$(find assets/games -type f | wc -l)

            echo "Game asset count: $COUNT"

            find assets/games -type f | sort
          else
            echo "No game assets found."
          fi


      # ==========================================
      # 8. CHECK FLUTTER PROJECT
      # ==========================================
      - name: Check Flutter project
        run: |
          set -e

          cd app

          flutter analyze --no-fatal-infos --no-fatal-warnings


      # ==========================================
      # 9. BUILD RELEASE APK
      # ==========================================
      - name: Build Release APK
        run: |
          set -e

          cd app

          flutter clean
          flutter pub get

          echo "======================================"
          echo "BUILDING WIKALIVE APK"
          echo "======================================"

          flutter build apk --release

          echo "======================================"
          echo "APK BUILD COMPLETED"
          echo "======================================"


      # ==========================================
      # 10. VERIFY APK
      # ==========================================
      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "WIKALIVE APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"


      # ==========================================
      # 11. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
