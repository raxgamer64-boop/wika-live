name: Build WikaLive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        run: |
          set -e

          flutter create --project-name wika_live app

          cp main.dart app/lib/main.dart
          cp google-services.json app/android/app/google-services.json

          echo "======================================"
          echo "FLUTTER PROJECT CREATED"
          echo "======================================"

          test -f app/lib/main.dart
          test -f app/android/app/google-services.json

          echo "main.dart FOUND"
          echo "google-services.json FOUND"


      # ==========================================
      # 4. CONFIGURE FIREBASE
      # ==========================================
      - name: Configure Firebase
        run: |
          set -e

          cd app

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          build = Path("android/app/build.gradle.kts")

          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false
          """,
                  1
              )

          settings.write_text(text)

          text = build.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services")
          """,
                  1
              )

          build.write_text(text)

          print("Firebase Google Services configured.")
          PY

          test -f android/app/google-services.json

          echo "google-services.json FOUND"


      # ==========================================
      # 5. GET PACKAGES
      # ==========================================
      - name: Get packages
        run: |
          set -e

          cd app

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:6.3.0

          flutter pub get


      # ==========================================
      # 6. VERIFY FIREBASE JSON
      # ==========================================
      - name: Verify Firebase JSON
        run: |
          set -e

          python3 - <<'PY'
          import json

          path = "app/android/app/google-services.json"

          with open(path, "r") as f:
              data = json.load(f)

          project_id = data["project_info"]["project_id"]

          print("Firebase Project:", project_id)

          found = False

          for client in data.get("client", []):

              package = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package == "com.example.wika_live":
                  found = True
                  print("Package: com.example.wika_live")

          if not found:
              raise SystemExit(
                  "ERROR: com.example.wika_live not found in google-services.json"
              )

          print("Firebase JSON verification successful.")
          PY


      # ==========================================
      # 7. CHECK FLUTTER PROJECT
      # ==========================================
      - name: Check Flutter project
        run: |
          set -e

          cd app

          flutter analyze --no-fatal-infos --no-fatal-warnings


      # ==========================================
      # 8. BUILD RELEASE APK
      # ==========================================
      - name: Build Release APK
        run: |
          set -e

          cd app

          flutter clean
          flutter pub get

          echo "======================================"
          echo "BUILDING WIKALIVE APK"
          echo "======================================"

          flutter build apk --release

          echo "======================================"
          echo "APK BUILD COMPLETED"
          echo "======================================"


      # ==========================================
      # 9. VERIFY APK
      # ==========================================
      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "WIKALIVE APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"


      # ==========================================
      # 10. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
