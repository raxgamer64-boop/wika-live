name: Build WikaLive APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          set -e
          flutter create --org com.example --project-name wika_live app

      - name: Copy app files
        run: |
          set -e
          cp main.dart app/lib/main.dart
          test -f google-services.json && cp google-services.json app/android/app/google-services.json || true

      - name: Configure Firebase Google Services
        working-directory: app
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/settings.gradle.kts')
          s = p.read_text()
          s = s.replace(
              'plugins {',
              'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
              1,
          )
          p.write_text(s)
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace(
              'plugins {',
              'plugins {\n    id("com.google.gms.google-services")',
              1,
          )
          p.write_text(s)
          PY

      - name: Add packages
        working-directory: app
        run: |
          set -e
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub get

      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'signingConfigs {' not in s:
              marker = 'android {'
              block = '''android {\n    signingConfigs {\n        create("release") {\n            val propsFile = rootProject.file("key.properties")\n            if (propsFile.exists()) {\n                val props = java.util.Properties().apply { propsFile.inputStream().use { load(it) } }\n                storeFile = file("${props["storeFile"]}")\n                storePassword = props["storePassword"]?.toString()\n                keyAlias = props["keyAlias"]?.toString()\n                keyPassword = props["keyPassword"]?.toString()\n            }\n        }\n    }'''
              s=s.replace(marker, block, 1)
          p.write_text(s)
          PY

      - name: Analyze Dart
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          
