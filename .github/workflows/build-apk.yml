name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            app

          test -f main.dart || {
            echo "ERROR: Root main.dart is missing."
            exit 1
          }

          test -d assets/live_ui || {
            echo "ERROR: assets/live_ui folder is missing."
            exit 1
          }

          mkdir -p app/lib
          mkdir -p app/assets

          cp main.dart app/lib/main.dart
          cp -R assets/live_ui app/assets/live_ui

          echo "main.dart copied successfully."
          echo "live_ui assets copied successfully."


      # ==========================================
      # 4. KOTLIN / ANDROID GRADLE COMPATIBILITY
      # ==========================================
      - name: Configure Kotlin 2.3.0
        shell: bash
        run: |
          set -e

          SETTINGS="app/android/settings.gradle.kts"

          test -f "$SETTINGS" || {
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # Replace Kotlin Android plugin version if present.
          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"',
              'id("org.jetbrains.kotlin.android") version "2.3.0"',
              text
          )

          # If Flutter generated the plugin line differently,
          # ensure the Kotlin Android plugin is present.
          if 'id("org.jetbrains.kotlin.android")' not in text:
              marker = "plugins {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + '\n    id("org.jetbrains.kotlin.android") version "2.3.0"',
                      1
                  )

          path.write_text(text, encoding="utf-8")
          PY

          echo "Kotlin configuration:"
          grep -n "kotlin" "$SETTINGS" || true


      # ==========================================
      # 5. CONFIGURE ANDROID GRADLE PLUGIN
      # ==========================================
      - name: Configure Android Gradle Plugin
        shell: bash
        run: |
          set -e

          SETTINGS="app/android/settings.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # Keep AGP in the 8.x line compatible with Kotlin 2.3.0.
          text = re.sub(
              r'id\("com\.android\.application"\)\s+version\s+"[^"]+"',
              'id("com.android.application") version "8.7.3"',
              text
          )

          path.write_text(text, encoding="utf-8")
          PY

          echo "Android Gradle Plugin configuration:"
          grep -n "com.android.application" "$SETTINGS" || true


      # ==========================================
      # 6. PATCH ZEGO CONTROLLER API
      # ==========================================
      - name: Patch ZEGO controller API
        shell: bash
        run: |
          set -e

          FILE="app/lib/main.dart"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/lib/main.dart")
          text = path.read_text(encoding="utf-8")

          # Keep existing ZEGO calls intact.
          # This step intentionally does not alter ZEGO logic.

          path.write_text(text, encoding="utf-8")

          print("ZEGO source preserved.")
          PY


      # ==========================================
      # 7. FIREBASE
      # ==========================================
      - name: Configure Firebase
        shell: bash
        run: |
          set -e

          test -f google-services.json || {
            echo "ERROR: google-services.json is missing."
            exit 1
          }

          mkdir -p app/android/app

          cp google-services.json \
            app/android/app/google-services.json

          echo "Firebase google-services.json copied."


      # ==========================================
      # 8. ANDROID PERMISSIONS
      # ==========================================
      - name: Configure Android permissions
        shell: bash
        run: |
          set -e

          MANIFEST="app/android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
          ]

          marker = "<application"

          additions = ""

          for permission in permissions:
              if permission not in text:
                  additions += "    " + permission + "\n"

          if additions and marker in text:
              text = text.replace(
                  marker,
                  additions + "\n    " + marker,
                  1
              )

          path.write_text(text, encoding="utf-8")
          PY

          echo "Android permissions configured."


      # ==========================================
      # 9. GOOGLE SERVICES PLUGIN
      # ==========================================
      - name: Configure Google Services
        shell: bash
        run: |
          set -e

          SETTINGS="app/android/settings.gradle.kts"
          APP_GRADLE="app/android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          # settings.gradle.kts
          settings = Path("app/android/settings.gradle.kts")
          text = settings.read_text(encoding="utf-8")

          google_plugin = (
              'id("com.google.gms.google-services") '
              'version "4.4.2" apply false'
          )

          if 'id("com.google.gms.google-services")' not in text:
              marker = "plugins {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    " + google_plugin,
                      1
                  )

          settings.write_text(text, encoding="utf-8")

          # app/build.gradle.kts
          app = Path("app/android/app/build.gradle.kts")
          text = app.read_text(encoding="utf-8")

          if 'id("com.google.gms.google-services")' not in text:
              marker = "plugins {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + '\n    id("com.google.gms.google-services")',
                      1
                  )

          app.write_text(text, encoding="utf-8")
          PY

          echo "Google Services configured."


      # ==========================================
      # 10. ANDROIDX
      # ==========================================
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROPERTIES="app/android/gradle.properties"

          touch "$PROPERTIES"

          grep -q '^android.useAndroidX=true' "$PROPERTIES" || \
            echo 'android.useAndroidX=true' >> "$PROPERTIES"

          grep -q '^android.enableJetifier=true' "$PROPERTIES" || \
            echo 'android.enableJetifier=true' >> "$PROPERTIES"

          echo "AndroidX configured."


      # ==========================================
      # 11. FLUTTER DEPENDENCIES
      # ==========================================
      - name: Configure Flutter dependencies
        working-directory: app
        shell: bash
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          flutter pub get


      # ==========================================
      # 12. LIVE UI ASSETS
      # ==========================================
      - name: Configure live UI assets
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")

          if "    - assets/live_ui/" not in text:
              lines = text.splitlines(True)

              indexes = []

              for i, line in enumerate(lines):
                  if re.match(r"^flutter:\s*$", line):
                      indexes.append(i)

              if not indexes:
                  raise SystemExit(
                      "ERROR: Root flutter: section not found."
                  )

              idx = indexes[-1]
              insert_at = idx + 1

              while insert_at < len(lines):
                  line = lines[insert_at]

                  if line.strip() and not line.startswith(" "):
                      break

                  insert_at += 1

              lines[insert_at:insert_at] = [
                  "\n",
                  "  assets:\n",
                  "    - assets/live_ui/\n",
              ]

              path.write_text(
                  "".join(lines),
                  encoding="utf-8"
              )

          print("live_ui asset configuration complete.")
          PY

          flutter pub get


      # ==========================================
      # 13. VERIFY ASSETS
      # ==========================================
      - name: Verify live UI assets
        shell: bash
        run: |
          set -e

          test -f app/assets/live_ui/logo.png || {
            echo "ERROR: logo.png missing."
            exit 1
          }

          test -f app/assets/live_ui/ic_guardian_gold.png || {
            echo "ERROR: ic_guardian_gold.png missing."
            exit 1
          }

          echo "Live UI assets verified."

          find app/assets/live_ui \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


      # ==========================================
      # 14. VERIFY FIREBASE
      # ==========================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json

          with open(
              "app/android/app/google-services.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          project_id = (
              data
              .get("project_info", {})
              .get("project_id")
          )

          print("Firebase project:", project_id)

          if project_id != "wika-live":
              raise SystemExit(
                  "ERROR: Firebase project is not wika-live."
              )
          PY


      # ==========================================
      # 15. RELEASE SIGNING
      # ==========================================
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking signing secrets..."

          missing=0

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            missing=1
          fi

          if [ -z "$KEYSTORE_PASS" ]; then
            echo "ERROR: KEYSTORE_PASS is missing."
            missing=1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            missing=1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > app/android/app/upload-keystore.jks

          test -s app/android/app/upload-keystore.jks || {
            echo "ERROR: Keystore file was not created."
            exit 1
          }

          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "Signing configuration created."


      # ==========================================
      # 16. GRADLE RELEASE SIGNING
      # ==========================================
      - name: Configure Gradle release signing
        shell: bash
        run: |
          set -e

          FILE="app/android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          imports = r'''
          import java.util.Properties
          import java.io.FileInputStream

          val keyPropertiesFile =
              rootProject.file("key.properties")

          val keyProperties = Properties()

          if (keyPropertiesFile.exists()) {
              keyProperties.load(
                  FileInputStream(keyPropertiesFile)
              )
          }

          '''

          if "val keyPropertiesFile" not in text:
              text = imports + text

          if "signingConfigs {" not in text:
              marker = "android {"

              signing = r'''
              signingConfigs {
                  create("release") {
                      if (keyPropertiesFile.exists()) {
                          storeFile = file(
                              keyProperties["storeFile"] as String
                          )

                          storePassword =
                              keyProperties["storePassword"] as String

                          keyAlias =
                              keyProperties["keyAlias"] as String

                          keyPassword =
                              keyProperties["keyPassword"] as String
                      }
                  }
              }

              '''

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + signing,
                      1
                  )

          # Ensure release build uses release signing.
          if 'signingConfig = signingConfigs.getByName("release")' \
                  not in text:

              release_marker = "release {"
              pos = text.find(release_marker)

              if pos != -1:
                  insert_pos = pos + len(release_marker)

                  text = (
                      text[:insert_pos]
                      + '\n'
                      + '            signingConfig = '
                      + 'signingConfigs.getByName("release")'
                      + text[insert_pos:]
                  )

          path.write_text(text, encoding="utf-8")
          PY

          echo "Release signing configured."


      # ==========================================
      # 17. FLUTTER ANALYZE
      # ==========================================
      - name: Flutter analyze
        working-directory: app
        shell: bash
        run: |
          set +e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

          ANALYZE_EXIT=$?

          echo ""
          echo "Flutter analyze exit code: $ANALYZE_EXIT"
          echo "Analyzer info/warnings do not stop the release build."

          exit 0


      # ==========================================
      # 18. BUILD RELEASE APK
      # ==========================================
      - name: Build release APK
        working-directory: app
        shell: bash
        run: |
          set -e

          flutter build apk --release

          test -f \
            build/app/outputs/flutter-apk/app-release.apk || {
              echo "ERROR: Release APK was not generated."
              exit 1
          }

          echo "Release APK generated successfully."


      # ==========================================
      # 19. BUILD RELEASE AAB
      # ==========================================
      - name: Build release AAB
        working-directory: app
        shell: bash
        run: |
          set -e

          flutter build appbundle --release

          test -f \
            build/app/outputs/bundle/release/app-release.aab || {
              echo "ERROR: Release AAB was not generated."
              exit 1
          }

          echo "Release AAB generated successfully."


      # ==========================================
      # 20. VERIFY APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"


      # ==========================================
      # 21. VERIFY AAB
      # ==========================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="app/build/app/outputs/bundle/release/app-release.aab"

          test -f "$AAB"

          echo "AAB:"
          ls -lh "$AAB"

          echo "AAB SHA256:"
          sha256sum "$AAB"


      # ==========================================
      # 22. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


      # ==========================================
      # 23. UPLOAD AAB
      # ==========================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      # ==========================================
      # 24. FINAL STATUS
      # ==========================================
      - name: Build completed
        shell: bash
        run: |
          echo "=========================================="
          echo "WikaLive BUILD COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo ""
          echo "APK:"
          echo "app/build/app/outputs/flutter-apk/app-r
