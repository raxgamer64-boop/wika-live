name: Build WikaLive Production APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Create Flutter Android project
        shell: bash
        run: |
          set -e

          rm -rf app

          flutter create \
            --no-pub \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          cp lib/main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml
          cp google-services.json app/android/app/google-services.json

      - name: Add Android permissions
        working-directory: app
        shell: bash
        run: |
          set -e

          sed -i '/<application/i\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
            android/app/src/main/AndroidManifest.xml

      - name: Configure Google Services
        working-directory: app
        shell: bash
        run: |
          set -e

          sed -i '/plugins {/a\
              id("com.google.gms.google-services") version "4.4.3" apply false' \
            android/settings.gradle.kts

          sed -i '/plugins {/a\
              id("com.google.gms.google-services")' \
            android/app/build.gradle.kts

      - name: Configure Java 17
        working-directory: app
        shell: bash
        run: |
          set -e

          sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
            android/app/build.gradle.kts

          cat >> android/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=true
android.enableJetifier=true
EOF

      - name: Verify required files
        working-directory: app
        shell: bash
        run: |
          set -e

          test -s lib/main.dart
          test -s pubspec.yaml
          test -s android/app/google-services.json

          echo "main.dart found"
          echo "pubspec.yaml found"
          echo "google-services.json found"

      - name: Check source
        working-directory: app
        shell: bash
        run: |
          set -e

          if grep -niE '\bgame\b|game' lib/main.dart; then
            echo "ERROR: Game reference found in main.dart"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          text = Path("lib/main.dart").read_text()

          checks = {
              "braces": ("{", "}"),
              "parentheses": ("(", ")"),
              "brackets": ("[", "]"),
          }

          for name, pair in checks.items():
              if text.count(pair[0]) != text.count(pair[1]):
                  raise SystemExit(
                      f"ERROR: {name} are not balanced"
                  )

          print("Source structure check passed.")
          PY

      - name: Configure Android signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$KEYSTORE_PASS" || {
            echo "ERROR: KEYSTORE_PASS is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing"
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASS" \
            -alias "$KEY_ALIAS"

      - name: Get Flutter packages
        working-directory: app
        shell: bash
        run: |
          set -e
          flutter pub get

      - name: Flutter Analyze
        working-directory: app
        shell: bash
        run: |
          set -e
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASS }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          test -n "$ZEGO_APP_SIGN" || {
            echo "ERROR: ZEGO_APP_SIGN is missing"
            exit 1
          }

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --dart-define="ZEGO_APP_SIGN=$ZEGO_APP_SIGN"

          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASS }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          flutter build appbundle \
            --release \
            --dart-define="ZEGO_APP_SIGN=$ZEGO_APP_SIGN"

          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-AAB
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
