name: Build WikaLive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create Flutter project
        run: |
          rm -rf wika_build
          flutter create --org com.example --project-name wika_live wika_build

      - name: Copy application files
        run: |
          cp main.dart wika_build/lib/main.dart

          if [ -f google-services.json ]; then
            mkdir -p wika_build/android/app
            cp google-services.json wika_build/android/app/google-services.json
          fi

          if [ -d assets/games ]; then
            mkdir -p wika_build/assets/games
            cp -r assets/games/. wika_build/assets/games/
          fi

      - name: Configure Google Services
        working-directory: wika_build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle.kts")
          if p.exists():
              text = p.read_text()

              if "com.google.gms.google-services" not in text:
                  marker = 'plugins {\n'
                  if marker in text:
                      text = text.replace(
                          marker,
                          'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false\n',
                          1
                      )
                      p.write_text(text)

          p = Path("android/app/build.gradle.kts")
          if p.exists():
              text = p.read_text()

              if 'com.google.gms.google-services' not in text:
                  text += '\nplugins {\n    id("com.google.gms.google-services")\n}\n'
                  p.write_text(text)
          PY

      - name: Configure dependencies
        working-directory: wika_build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          text = p.read_text()

          marker = "dependencies:\n"

          if marker not in text:
              raise SystemExit("ERROR: dependencies section not found")

          before, after = text.split(marker, 1)

          # Remove the existing dependency block up to flutter:
          if "\nflutter:" in after:
              _, flutter_section = after.split("\nflutter:", 1)
              flutter_section = "\nflutter:" + flutter_section
          else:
              flutter_section = "\nflutter:\n  uses-material-design: true\n"

          dependencies = """dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3
  google_sign_in: ^7.2.0
"""

          # Rebuild pubspec cleanly.
          p.write_text(
              before.rstrip()
              + "\n\n"
              + dependencies
              + flutter_section
          )
          PY

      - name: Configure assets
        working-directory: wika_build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          text = p.read_text()

          # Remove any previously inserted assets section.
          lines = text.splitlines()

          cleaned = []
          i = 0

          while i < len(lines):
              line = lines[i]

              if line.strip() == "assets:" and line.startswith("  "):
                  i += 1

                  while i < len(lines):
                      next_line = lines[i]

                      if next_line.startswith("    - "):
                          i += 1
                      else:
                          break

                  continue

              cleaned.append(line)
              i += 1

          text = "\n".join(cleaned).rstrip() + "\n"

          if "flutter:\n" not in text:
              raise SystemExit("ERROR: flutter section not found")

          text = text.replace(
              "flutter:\n",
              "flutter:\n  assets:\n    - assets/games/\n",
              1
          )

          p.write_text(text)
          PY

      - name: Verify pubspec.yaml
        working-directory: wika_build
        run: |
          echo "======================================"
          echo "FINAL PUBSPEC.YAML"
          echo "======================================"
          cat pubspec.yaml

          echo "======================================"
          echo "PUBSPEC CHECK"
          echo "======================================"
          flutter pub get

      - name: Analyze Flutter project
        working-directory: wika_build
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: wika_build
        run: |
          flutter build apk --release

      - name: Verify APK
        working-directory: wika_build
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: wika_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
