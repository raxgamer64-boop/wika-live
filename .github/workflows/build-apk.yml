name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          # ==========================================
          # VERIFY REQUIRED SOURCE FILES
          # ==========================================
          test -f main.dart || {
            echo "ERROR: root main.dart is missing"
            exit 1
          }

          test -d assets/live_ui || {
            echo "ERROR: assets/live_ui is missing"
            exit 1
          }

          # ==========================================
          # COPY WIKALIVE SOURCE
          # ==========================================
          cp main.dart app/lib/main.dart

          mkdir -p app/assets

          # Reference live-room UI assets
          cp -R assets/live_ui app/assets/live_ui

          echo "=========================================="
          echo "WikaLive source copied successfully"
          echo "=========================================="

          echo "main.dart:"
          ls -lh app/lib/main.dart

          echo "live_ui assets:"
          find app/assets/live_ui -maxdepth 1 -type f -print


      # ==========================================
      # 4. PATCH ZEGO API MISMATCHES
      # ==========================================
      - name: Patch ZEGO API compatibility
        run: |
          set -e

          python3 - <<'PYFIX'
          from pathlib import Path
          import re

          p = Path("app/lib/main.dart")

          if not p.exists():
              raise SystemExit("ERROR: app/lib/main.dart is missing")

          text = p.read_text()

          # ==========================================
          # REMOVE UNSUPPORTED CONTROLLER PARAMETER
          # ==========================================
          text = text.replace(
              "    controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          text = text.replace(
              "      controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          text = text.replace(
              "        controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          # ==========================================
          # MICROPHONE TOGGLE
          # ==========================================
          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().microphone.toggle()",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.switchState()"
          )

          text = text.replace(
              "controller.microphone.toggle()",
              "controller.audioVideo.microphone.switchState()"
          )

          # ==========================================
          # CAMERA TOGGLE
          # ==========================================
          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().camera.toggle()",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.switchState()"
          )

          text = text.replace(
              "controller.camera.toggle()",
              "controller.audioVideo.camera.switchState()"
          )

          # ==========================================
          # OLD DIRECT CAMERA/MIC STATE REFERENCES
          # ==========================================
          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().microphone.isOn",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.localState"
          )

          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().camera.isOn",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.localState"
          )

          # Common old local controller references.
          text = text.replace(
              "controller.microphone.isOn",
              "controller.audioVideo.microphone.localState"
          )

          text = text.replace(
              "controller.camera.isOn",
              "controller.audioVideo.camera.localState"
          )

          p.write_text(text)

          print("ZEGO compatibility patch completed.")
          PYFIX


      # ==========================================
      # 5. FIREBASE CONFIGURATION
      # ==========================================
      - name: Configure Firebase
        run: |
          set -e

          test -f google-services.json || {
            echo "ERROR: google-services.json is missing"
            exit 1
          }

          mkdir -p app/android/app

          cp google-services.json \
            app/android/app/google-services.json

          echo "Firebase configuration copied."


      # ==========================================
      # 6. ANDROID PERMISSIONS
      # ==========================================
      - name: Configure Android permissions
        run: |
          set -e

          MANIFEST="app/android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST" || {
            echo "ERROR: AndroidManifest.xml is missing"
            exit 1
          }

          python3 - <<'PYMANIFEST'
          from pathlib import Path

          p = Path("app/android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]

          marker = '<application'

          additions = ""

          for permission in permissions:
              if permission not in text:
                  additions += "    " + permission + "\n"

          if additions:
              text = text.replace(
                  marker,
                  additions + "\n    " + marker,
                  1
              )

          p.write_text(text)

          print("Android permissions configured.")
          PYMANIFEST


      # ==========================================
      # 7. ANDROIDX / GRADLE CONFIGURATION
      # ==========================================
      - name: Configure Android build
        run: |
          set -e

          cd app

          # AndroidX
          if [ -f android/gradle.properties ]; then
            grep -q "android.useAndroidX=true" android/gradle.properties || \
              echo "android.useAndroidX=true" >> android/gradle.properties

            grep -q "android.enableJetifier=true" android/gradle.properties || \
              echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          # Kotlin
          if [ -f android/settings.gradle.kts ]; then
            sed -i \
              "s/org.jetbrains.kotlin.android version '[^']*'/org.jetbrains.kotlin.android version '2.3.21'/" \
              android/settings.gradle.kts || true
          fi

          # JVM 17
          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PYGRADLE'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          if "JavaVersion.VERSION_17" not in text:
              text += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(text)
          PYGRADLE
          fi

          cd ..


      # ==========================================
      # 8. CONFIGURE GOOGLE SERVICES PLUGIN
      # ==========================================
      - name: Configure Google Services
        run: |
          set -e

          cd app

          if [ -f android/settings.gradle.kts ]; then

            python3 - <<'PYGS'
          from pathlib import Path

          p = Path("android/settings.gradle.kts")
          text = p.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services") version "4.4.4" apply false"""
              )

          p.write_text(text)
          PYGS

          fi

          if [ -f android/app/build.gradle.kts ]; then

            python3 - <<'PYAPPGS'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services")"""
              )

          p.write_text(text)
          PYAPPGS

          fi

          cd ..


      # ==========================================
      # 9. PUBSPEC DEPENDENCIES
      # ==========================================
      - name: Configure Flutter dependencies
        run: |
          set -e

          cd app

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          python3 - <<'PYASSET'
          from pathlib import Path

          p = Path("pubspec.yaml")
          text = p.read_text()

          # ==========================================
          # ADD ONLY THE REFERENCE LIVE UI ASSET FOLDER
          # ==========================================
          if "assets/live_ui/" not in text:

              if "flutter:" in text and "assets:" not in text:
                  text = text.replace(
                      "flutter:\n",
                      """flutter:
            assets:
              - assets/live_ui/
          """,
                      1
                  )

              elif "flutter:" in text and "    assets:" not in text:
                  text = text.replace(
                      "flutter:\n",
                      """flutter:
            assets:
              - assets/live_ui/
          """,
                      1
                  )

          p.write_text(text)
          PYASSET

          flutter pub get

          cd ..


      # ==========================================
      # 10. VERIFY LIVE UI ASSETS
      # ==========================================
      - name: Verify WikaLive live UI assets
        run: |
          set -e

          test -d app/assets/live_ui || {
            echo "ERROR: app/assets/live_ui is missing"
            exit 1
          }

          test -f app/assets/live_ui/logo.png || {
            echo "ERROR: assets/live_ui/logo.png is missing"
            exit 1
          }

          test -f app/assets/live_ui/ic_guardian_gold.png || {
            echo "ERROR: assets/live_ui/ic_guardian_gold.png is missing"
            exit 1
          }

          echo "=========================================="
          echo "Live UI assets verified:"
          echo "=========================================="

          find app/assets/live_ui -maxdepth 1 -type f -print


      # ==========================================
      # 11. VERIFY FIREBASE
      # ==========================================
      - name: Verify Firebase configuration
        run: |
          set -e

          test -f app/android/app/google-services.json || {
            echo "ERROR: Firebase google-services.json is missing"
            exit 1
          }

          python3 - <<'PYFIREBASE'
          import json
          from pathlib import Path

          p = Path("app/android/app/google-services.json")
          data = json.loads(p.read_text())

          project = data.get("project_info", {})
          project_id = project.get("project_id")

          if project_id != "wika-live":
              raise SystemExit(
                  f"ERROR: Unexpected Firebase project: {project_id}"
              )

          print("Firebase project verified: wika-live")
          PYFIREBASE


      # ==========================================
      # 12. RELEASE SIGNING
      # ==========================================
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking Android signing secrets..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASS" ]; then
            echo "ERROR: KEYSTORE_PASS is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/wikalive-release.jks

          test -s app/android/app/wikalive-release.jks || {
            echo "ERROR: Keystore could not be created."
            exit 1
          }

          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=wikalive-release.jks
          EOF

          python3 - <<'PYSIGN'
          from pathlib import Path

          p = Path("app/android/app/build.gradle.kts")
          text = p.read_text()

          signing_block = r'''
          import java.util.Properties
          import java.io.FileInputStream

          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''

          if "keystorePropertiesFile" not in text:
              text = signing_block + "\n" + text

          # Add release signing configuration only when the normal Flutter
          # release block exists.
          if "signingConfigs" not in text:
              text = text.replace(
                  "android {",
                  """android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }
          """,
                  1
              )

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              text = text.replace(
                  "buildTypes {",
                  """buildTypes {
              getByName("release") {
                  signingConfig = signingConfigs.getByName("release")
              }
          """,
                  1
              )

          p.write_text(text)
          PYSIGN


      # ==========================================
      # 13. DART ANALYZE
      # ==========================================
      - name: Analyze Flutter project
        run: |
          set -e

          cd app

          flutter analyze --no-fatal-infos

          cd ..


      # ==========================================
      # 14. BUILD RELEASE APK
      # ==========================================
      - name: Build release APK
        run: |
          set -e

          cd app

          flutter build apk \
            --release \
            --split-per-abi=false

          cd ..


      # ==========================================
      # 15. VERIFY APK
      # ==========================================
      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK" || {
            echo "ERROR: Release APK was not created."
            exit 1
          }

          echo "=========================================="
          echo "WikaLive APK BUILD SUCCESS"
          echo "=========================================="

          ls -lh "$APK"


      # ==========================================
      # 16. UPLOAD APK
      # ==========================================
      - name: Upload WikaLive APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
