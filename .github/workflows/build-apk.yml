name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            --platforms android \
            app

          test -f main.dart || {
            echo "ERROR: root main.dart is missing."
            exit 1
          }

          test -d assets/live_ui || {
            echo "ERROR: assets/live_ui folder is missing."
            exit 1
          }

          cp main.dart app/lib/main.dart

          mkdir -p app/assets
          cp -R assets/live_ui app/assets/live_ui

          test -f app/lib/main.dart
          test -f app/assets/live_ui/logo.png

          echo "WIKALIVE SOURCE COPIED"


      # ==========================================
      # 4. ZEGO COMPATIBILITY
      # ==========================================
      - name: Patch ZEGO API compatibility
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/lib/main.dart")
          text = p.read_text(encoding="utf-8")

          text = text.replace(
              "    controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          text = text.replace(
              "      controller: ZegoUIKitPrebuiltLiveStreamingController(),\n",
              ""
          )

          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().microphone.toggle()",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.switchState()"
          )

          text = text.replace(
              "ZegoUIKitPrebuiltLiveStreamingController().camera.toggle()",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.switchState()"
          )

          text = text.replace(
              "controller.microphone.toggle()",
              "controller.audioVideo.microphone.switchState()"
          )

          text = text.replace(
              "controller.camera.toggle()",
              "controller.audioVideo.camera.switchState()"
          )

          text = text.replace(
              "u.isCameraOn || u.isMicrophoneOn",
              "u.camera.value || u.microphone.value"
          )

          text = re.sub(
              r"ZegoUIKitPrebuiltLiveStreamingController\(\)\s*\.\s*microphone(?:\s*\.\s*value)?",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.microphone.localState",
              text
          )

          text = re.sub(
              r"ZegoUIKitPrebuiltLiveStreamingController\(\)\s*\.\s*camera(?:\s*\.\s*value)?",
              "ZegoUIKitPrebuiltLiveStreamingController().audioVideo.camera.localState",
              text
          )

          text = re.sub(
              r"(?<![A-Za-z0-9_])controller\s*\.\s*microphone(?:\s*\.\s*value)?",
              "controller.audioVideo.microphone.localState",
              text
          )

          text = re.sub(
              r"(?<![A-Za-z0-9_])controller\s*\.\s*camera(?:\s*\.\s*value)?",
              "controller.audioVideo.camera.localState",
              text
          )

          p.write_text(text, encoding="utf-8")
          PY

          if grep -qE "isCameraOn|isMicrophoneOn" app/lib/main.dart; then
            echo "ERROR: obsolete ZEGO fields remain."
            exit 1
          fi

          echo "ZEGO compatibility OK."


      # ==========================================
      # 5. FIREBASE
      # ==========================================
      - name: Configure Firebase
        shell: bash
        run: |
          set -e

          test -f google-services.json

          mkdir -p app/android/app

          cp google-services.json \
            app/android/app/google-services.json

          test -f app/android/app/google-services.json

          echo "Firebase configuration OK."


      # ==========================================
      # 6. ANDROID PERMISSIONS
      # ==========================================
      - name: Configure Android permissions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/android/app/src/main/AndroidManifest.xml"
          )

          text = p.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "\n    <application",
                      "\n" + permission + "\n    <application",
                      1
                  )

          p.write_text(text, encoding="utf-8")
          PY

          echo "Android permissions OK."


      # ==========================================
      # 7. ANDROID GRADLE / KOTLIN
      # ==========================================
      - name: Configure Android Gradle
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------
          # settings.gradle.kts
          # ------------------------------------------
          settings = Path("android/settings.gradle.kts")
          text = settings.read_text(encoding="utf-8")

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false
          """,
                  1
              )

          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false',
              text,
              count=1
          )

          if 'id("org.jetbrains.kotlin.android")' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false
          """,
                  1
              )

          settings.write_text(text, encoding="utf-8")


          # ------------------------------------------
          # app/build.gradle.kts
          # ------------------------------------------
          build = Path("android/app/build.gradle.kts")
          text = build.read_text(encoding="utf-8")

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services")
          """,
                  1
              )

          # Remove obsolete Kotlin syntax.
          text = re.sub(
              r'\n[ \t]*kotlinOptions\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          text = re.sub(
              r'\n[ \t]*jvmTarget\s*=\s*JavaVersion\.VERSION_\d+\.toString\(\)',
              '',
              text
          )

          # Java 17.
          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:

              marker = "android {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: android block missing."
                  )

              block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

          """

              pos = text.find(marker) + len(marker)

              text = (
                  text[:pos]
                  + "\n"
                  + block
                  + text[pos:]
              )


          # ------------------------------------------
          # Release signing configuration
          # ------------------------------------------
          if 'create("wikaliveRelease")' not in text:

              signing = """
          signingConfigs {
              create("wikaliveRelease") {
                  storeFile = file("upload-keystore.jks")
                  storePassword =
                      providers.gradleProperty("storePassword").orNull
                  keyAlias =
                      providers.gradleProperty("keyAlias").orNull
                  keyPassword =
                      providers.gradleProperty("keyPassword").orNull
              }
          }

          """

              text = text.replace(
                  "buildTypes {",
                  signing + "buildTypes {",
                  1
              )


          if 'signingConfig = signingConfigs.getByName("wikaliveRelease")' not in text:

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("wikaliveRelease")""",
                  1
              )


          # ------------------------------------------
          # Kotlin compiler JVM 17
          # ------------------------------------------
          if "jvmTarget.set(" not in text:

              text += """

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          """

          build.write_text(text, encoding="utf-8")


          # ------------------------------------------
          # gradle.properties
          # ------------------------------------------
          gp = Path("android/gradle.properties")

          existing = (
              gp.read_text(encoding="utf-8")
              if gp.exists()
              else ""
          )

          def set_property(content, key, value):
              lines = content.splitlines()
              output = []
              found = False

              for line in lines:
                  if line.startswith(key + "="):
                      if not found:
                          output.append(key + "=" + value)
                          found = True
                  else:
                      output.append(line)

              if not found:
                  output.append(key + "=" + value)

              return "\n".join(output) + "\n"

          existing = set_property(
              existing,
              "org.gradle.jvmargs",
              "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          )

          existing = set_property(
              existing,
              "org.gradle.daemon",
              "false"
          )

          existing = set_property(
              existing,
              "org.gradle.parallel",
              "false"
          )

          existing = set_property(
              existing,
              "org.gradle.caching",
              "false"
          )

          existing = set_property(
              existing,
              "android.useAndroidX",
              "true"
          )

          existing = set_property(
              existing,
              "android.enableJetifier",
              "true"
          )

          gp.write_text(existing, encoding="utf-8")

          print("Kotlin 2.3.21")
          print("Java/JVM 17")
          print("AndroidX enabled")
          print("Google Services enabled")
          print("Signing configured")
          PY


      # ==========================================
      # 8. PACKAGES
      # ==========================================
      - name: Add packages
        working-directory: app
        shell: bash
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          flutter pub get


      # ==========================================
      # 9. LIVE UI ASSETS
      # ==========================================
      - name: Configure live UI assets
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          lines = p.read_text(encoding="utf-8").splitlines()

          flutter_index = None

          for i, line in enumerate(lines):
              if (
                  line.strip() == "flutter:"
                  and not line.startswith(" ")
                  and not line.startswith("\t")
              ):
                  flutter_index = i
                  break

          if flutter_index is None:
              raise SystemExit(
                  "ERROR: flutter section missing."
              )

          result = []
          i = 0

          while i < len(lines):

              if (
                  lines[i].strip() == "assets:"
                  and lines[i].startswith("  ")
              ):
                  i += 1

                  while i < len(lines):

                      line = lines[i]

                      if (
                          line.strip()
                          and not line.startswith(" ")
                          and not line.startswith("\t")
                      ):
                          break

                      i += 1

                  continue

              result.append(lines[i])
              i += 1

          lines = result

          flutter_index = next(
              i for i, line in enumerate(lines)
              if (
                  line.strip() == "flutter:"
                  and not line.startswith(" ")
                  and not line.startswith("\t")
              )
          )

          lines[
              flutter_index + 1:flutter_index + 1
          ] = [
              "  assets:",
              "    - assets/live_ui/",
          ]

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY

          test -f assets/live_ui/logo.png

          flutter pub get

          echo "Live UI assets OK."


      # ==========================================
      # 10. VERIFY FIREBASE
      # ==========================================
      - name: Verify Firebase
        working-directory: app
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json

          with open(
              "android/app/google-services.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          project_id = (
              data
              .get("project_info", {})
              .get("project_id")
          )

          if project_id != "wika-live":
              raise SystemExit(
                  f"ERROR: Wrong Firebase project: {project_id}"
              )

          package_found = False

          for client in data.get("client", []):

              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == "com.example.wika_live":
                  package_found = True

          if not package_found:
              raise SystemExit(
                  "ERROR: com.example.wika_live missing."
              )

          print("Firebase project: OK")
          print("Android package: OK")
          PY


      # ==========================================
      # 11. RELEASE KEYSTORE
      # ==========================================
      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "Checking signing secrets..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$STORE_PASS" ]; then
            echo "ERROR: KEYSTORE_PASS is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets: OK"

          mkdir -p android/app

          KEYSTORE_PATH="android/app/upload-keystore.jks"

          rm -f "$KEYSTORE_PATH"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Keystore created:"
          ls -lh "$KEYSTORE_PATH"

          echo "Verifying keystore..."

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" \
            -v | grep -E \
            "Alias name:|Entry type:|SHA1:"

          echo "RELEASE SIGNING READY"


      # ==========================================
      # 12. VERIFY KOTLIN
      # ==========================================
      - name: Verify Kotlin configuration
        working-directory: app
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          if grep -q "kotlinOptions" "$FILE"; then
            echo "ERROR: old kotlinOptions remains."
            exit 1
          fi

          if grep -q \
            "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" \
            "$FILE"; then
            echo "ERROR: invalid JvmTarget import found."
            exit 1
          fi

          grep -q "compilerOptions" "$FILE"
          grep -q "JvmTarget.JVM_17" "$FILE"
          grep -q "VERSION_17" "$FILE"

          echo "Kotlin configuration: OK"
          echo "JVM 17: OK"


      # ==========================================
      # 13. ANALYZE DART
      # ==========================================
      - name: Analyze Dart
        working-directory: app
        shell: bash
        run: |
          set +e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

          CODE=$?

          echo "Flutter analyze exit
