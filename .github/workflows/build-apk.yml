name: Build WikaLive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          set -e

          flutter create \
            --org com.example \
            --project-name wika_live \
            app

          cp main.dart app/lib/main.dart
          cp google-services.json app/android/app/google-services.json

          test -f app/lib/main.dart
          test -f app/android/app/google-services.json

      - name: Configure Kotlin
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          build = Path("android/app/build.gradle.kts")

          # ---------------------------------------------------------
          # Kotlin Gradle Plugin
          # ---------------------------------------------------------

          s = settings.read_text()

          pattern = (
              r'(id\(["\']org\.jetbrains\.kotlin\.android["\']\)'
              r'\s+version\s+["\'])[^"\']+(["\'])'
          )

          s, count = re.subn(
              pattern,
              r'\g<1>2.3.21\g<2>',
              s
          )

          if count == 0:
              print("WARNING: Kotlin plugin version pattern was not found.")
          else:
              print("Kotlin Gradle plugin set to 2.3.21.")

          settings.write_text(s)

          # ---------------------------------------------------------
          # Remove old kotlinOptions block from app/build.gradle.kts
          # ---------------------------------------------------------

          s = build.read_text()

          s = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.DOTALL
          )

          # Remove any previous incorrectly inserted compilerOptions
          # block if present.
          s = re.sub(
              r'\n\s*compilerOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.DOTALL
          )

          # Remove previous kotlin block if our earlier workflow
          # inserted one.
          s = re.sub(
              r'\n\s*kotlin\s*\{\s*compilerOptions\s*\{.*?\}\s*\}',
              '',
              s,
              flags=re.DOTALL
          )

          # ---------------------------------------------------------
          # Add required Kotlin import
          # ---------------------------------------------------------

          import_line = (
              "import org.jetbrains.kotlin.gradle.dsl.JvmTarget"
          )

          if import_line not in s:
              s = import_line + "\n" + s

          # ---------------------------------------------------------
          # Add Kotlin compilerOptions at PROJECT level.
          #
          # IMPORTANT:
          # This is intentionally outside android { }.
          # ---------------------------------------------------------

          kotlin_config = '''

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_11)
              }
          }
          '''

          s = s.rstrip() + kotlin_config

          build.write_text(s)

          print("Kotlin compilerOptions configured correctly.")
          PY

      - name: Configure Firebase
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          build = Path("android/app/build.gradle.kts")

          # Firebase Google Services plugin
          s = settings.read_text()

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n'
                  '    id("com.google.gms.google-services") '
                  'version "4.4.3" apply false',
                  1
              )

          settings.write_text(s)

          # Apply Google Services plugin
          s = build.read_text()

          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n'
                  '    id("com.google.gms.google-services")',
                  1
              )

          build.write_text(s)

          print("Firebase Google Services configured.")
          PY

      - name: Add packages
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming

          flutter pub get

      - name: Configure release signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ -z "$STORE_PASS" ]; then
            echo "ERROR: STORE_PASS is missing"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          test -f android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if "import java.util.Properties" not in s:
              s = "import java.util.Properties\n" + s

          # Add release signing configuration.
          if 'create("release")' not in s:

              signing_block = '''android {
              signingConfigs {
                  create("release") {
                      val propsFile = rootProject.file("key.properties")
                      val props = Properties()

                      if (propsFile.exists()) {
                          propsFile.inputStream().use {
                              props.load(it)
                          }

                          storeFile = rootProject.file(
                              props.getProperty("storeFile")
                          )

                          storePassword =
                              props.getProperty("storePassword")

                          keyAlias =
                              props.getProperty("keyAlias")

                          keyPassword =
                              props.getProperty("keyPassword")
                      }
                  }
              }
              '''

              s = s.replace(
                  "android {",
                  signing_block,
                  1
              )

          # Attach release signing configuration.
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace(
                  "release {",
                  'release {\n'
                  '            signingConfig = '
                  'signingConfigs.getByName("release")',
                  1
              )

          p.write_text(s)

          print("Release signing configured.")
          PY

      - name: Verify release keystore
        working-directory: app
        env:
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          test -f android/app/upload-keystore.jks

          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS"

      - name: Analyze Dart
        working-directory: app
        run: |
          set -e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build release APK
        working-directory: app
        env:
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: |
          set -e

          if [ -z "$ZEGO_APP_SIGN" ]; then
            echo "ERROR: ZEGO_APP_SIGN GitHub Secret is missing."
            exit 1
          fi

          flutter clean
          flutter pub get

          echo "Building WikaLive release APK..."

          flutter build apk \
            --release \
            --dart-define=ZEGO_APP_SIGN="$ZEGO_APP_SIGN"

      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
