name: Build WikaLive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          set -e

          flutter create --project-name wika_live app

          cp main.dart app/lib/main.dart
          cp google-services.json app/android/app/google-services.json

      - name: Configure Firebase
        run: |
          set -e
          cd app

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services") version "4.4.3" apply false''',
                  1
              )
              settings.write_text(text)

          build = Path("android/app/build.gradle.kts")
          text = build.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services")''',
                  1
              )
              build.write_text(text)
          PY

      - name: Get packages
        run: |
          set -e
          cd app

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add google_sign_in:6.3.0

          flutter pub get

      - name: Verify Firebase config
        run: |
          set -e

          if [ ! -f "app/android/app/google-services.json" ]; then
            echo "ERROR: google-services.json not found."
            exit 1
          fi

          echo "Firebase config found."

          echo "Checking package name:"
          grep -o '"package_name": "[^"]*"' app/android/app/google-services.json || true

          echo "Checking current EC SHA:"
          grep -o 'ece13bb4bbc4621151e30c03051e35f218862aac' \
            app/android/app/google-services.json || true

          echo "Checking Web OAuth client:"
          grep -o '3472205178-9u0i8qco4otu0qgmm6e9gabh4st49j1r.apps.googleusercontent.com' \
            app/android/app/google-services.json || true

      - name: Check Flutter project
        run: |
          set -e
          cd app

          flutter analyze || true

      - name: Build Release APK
        run: |
          set -e
          cd app

          flutter clean
          flutter pub get

          flutter build apk --release

      - name: Verify generated Google Services resources
        run: |
          set -e

          echo "======================================"
          echo "GENERATED FIREBASE CONFIG"
          echo "======================================"

          FILE="app/build/app/generated/res/google-services/release/values/values.xml"

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "First path not found. Searching..."
            find app/build -path "*google-services*values.xml" -print -exec cat {} \;
          fi

      - name: Show APK information
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "WikaLive APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh "$APK"

      - name: Get APK SHA fingerprints
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -1)

          if [ -n "$APKSIGNER" ]; then
            echo "======================================"
            echo "APK SHA FINGERPRINTS"
            echo "======================================"

            "$APKSIGNER" verify \
              --print-certs \
              "$APK" || true
          else
            echo "apksigner not found."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-APK-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
