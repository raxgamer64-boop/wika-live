name: Build WikaLive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          set -e
          flutter create --project-name wika_live app

          cp main.dart app/lib/main.dart
          cp google-services.json app/android/app/google-services.json

      - name: Configure Firebase Google Services
        run: |
          set -e
          cd app

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services") version "4.5.0" apply false''',
                  1
              )
              settings.write_text(text)

          build = Path("android/app/build.gradle.kts")
          text = build.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services")''',
                  1
              )
              build.write_text(text)

          print("===== settings.gradle.kts =====")
          print(settings.read_text())

          print("===== app/build.gradle.kts =====")
          print(build.read_text())
          PY

          echo "===== CHECK GOOGLE SERVICES JSON ====="
          test -f android/app/google-services.json

          echo "google-services.json FOUND"

      - name: Get packages
        run: |
          set -e
          cd app

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add google_sign_in:6.3.0

          flutter pub get

      - name: Verify Firebase JSON
        run: |
          set -e

          echo "===== FIREBASE JSON CHECK ====="

          python3 - <<'PY'
          import json

          with open("app/android/app/google-services.json") as f:
              data = json.load(f)

          print("Project ID:", data["project_info"]["project_id"])
          print("Project Number:", data["project_info"]["project_number"])

          for client in data["client"]:
              package = client["client_info"]["android_client_info"]["package_name"]

              if package == "com.example.wika_live":
                  print("PACKAGE: com.example.wika_live")

                  for oauth in client.get("oauth_client", []):
                      print(
                          "OAuth:",
                          oauth.get("client_type"),
                          oauth.get("client_id"),
                          oauth.get("android_info", {}).get("certificate_hash")
                      )
          PY

      - name: Check Flutter project
        run: |
          set -e
          cd app
          flutter analyze || true

      - name: Build Release APK
        run: |
          set -e
          cd app

          flutter clean
          flutter pub get

          flutter build apk --release

      - name: VERIFY FIREBASE GENERATED RESOURCES
        run: |
          set -e

          echo "======================================"
          echo "FIREBASE GENERATED RESOURCES"
          echo "======================================"

          echo "Searching for google-services generated files..."

          find app/build -type f \
            -path "*google-services*" \
            -print

          echo "======================================"
          echo "Searching values.xml..."
          echo "======================================"

          find app/build -type f \
            -name "values.xml" \
            -path "*google-services*" \
            -exec sh -c 'echo "----- $1 -----"; cat "$1"' _ {} \;

          echo "======================================"
          echo "Checking default_web_client_id..."
          echo "======================================"

          grep -R \
            "default_web_client_id" \
            app/build \
            2>/dev/null || true

          echo "======================================"
          echo "Checking google_app_id..."
          echo "======================================"

          grep -R \
            "google_app_id" \
            app/build \
            2>/dev/null || true

      - name: Verify APK
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "WikaLive APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Get APK SHA fingerprints
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -1)

          echo "======================================"
          echo "APK SHA FINGERPRINTS"
          echo "======================================"

          "$APKSIGNER" verify \
            --print-certs \
            "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-APK-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
