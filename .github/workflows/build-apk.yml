name: Build WikaLive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create Flutter project
        run: |
          rm -rf wika_build
          flutter create --org com.example --project-name wika_live wika_build

      - name: Copy application files
        run: |
          cp main.dart wika_build/lib/main.dart

          if [ -f google-services.json ]; then
            mkdir -p wika_build/android/app
            cp google-services.json wika_build/android/app/google-services.json
          fi

          if [ -d assets/games ]; then
            mkdir -p wika_build/assets/games
            cp -r assets/games/. wika_build/assets/games/
          fi

      - name: Configure Google Services
        working-directory: wika_build
        run: |
          python3 -c "from pathlib import Path; p=Path('android/settings.gradle.kts'); s=p.read_text(); s=s.replace('plugins {', 'plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false', 1) if 'com.google.gms.google-services' not in s else s; p.write_text(s)"

          python3 -c "from pathlib import Path; p=Path('android/app/build.gradle.kts'); s=p.read_text(); s=s.replace('plugins {', 'plugins {\n    id(\"com.google.gms.google-services\")', 1) if 'id(\"com.google.gms.google-services\")' not in s else s; p.write_text(s)"

      - name: Configure pubspec
        working-directory: wika_build
        run: |
          python3 -c "from pathlib import Path; p=Path('pubspec.yaml'); s=p.read_text(); start=s.index('dependencies:'); end=s.index('\nflutter:', start); deps=['dependencies:','  flutter:','    sdk: flutter','  cupertino_icons: ^1.0.8','  firebase_core: ^4.15.0','  firebase_auth: ^6.7.0','  cloud_firestore: ^6.10.0','  firebase_storage: ^13.6.0','  image_picker: ^1.2.3','  google_sign_in: ^7.2.0']; s=s[:start]+'\\n'.join(deps)+s[end:]; p.write_text(s)"

      - name: Configure game assets
        working-directory: wika_build
        run: |
          python3 -c "from pathlib import Path; p=Path('pubspec.yaml'); s=p.read_text(); s=s.replace('flutter:\n', 'flutter:\n  assets:\n    - assets/games/\n', 1); p.write_text(s)"

      - name: Show final pubspec
        working-directory: wika_build
        run: |
          echo "======================================"
          echo "FINAL PUBSPEC.YAML"
          echo "======================================"
          cat pubspec.yaml

      - name: Get packages
        working-directory: wika_build
        run: |
          flutter pub get

      - name: Analyze Flutter project
        working-directory: wika_build
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: wika_build
        run: |
          flutter build apk --release

      - name: Verify APK
        working-directory: wika_build
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: wika_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
