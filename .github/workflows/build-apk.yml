name: Build WikaLive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          set -e
          rm -rf app
          flutter create --project-name wika_live app
          cp main.dart app/lib/main.dart
          mkdir -p app/android/app
          cp google-services.json app/android/app/google-services.json

      - name: Get packages
        working-directory: app
        run: |
          set -e
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in
          flutter pub get

      - name: Add game assets
        working-directory: app
        run: |
          set -e
          if [ -d ../assets/games ]; then
            mkdir -p assets/games
            cp -r ../assets/games/. assets/games/
            sed -i '/^  uses-material-design: true$/a\          assets:\            - assets/games/' pubspec.yaml
          fi
          flutter pub get

      - name: Configure Firebase and Signing
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          # 1. settings.gradle.kts update
          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()
          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.3" apply false',
                  1,
              )
              settings.write_text(text)

          # 2. build.gradle.kts ko poora naye sirse likhna
          gradle_code = textwrap.dedent("""
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
              id("com.google.gms.google-services")
          }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.example.wika_live"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_11.toString()
              }

              defaultConfig {
                  applicationId = "com.example.wika_live"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias") ?: "wika"
                      keyPassword = keystoreProperties.getProperty("keyPassword") ?: "wika123"
                      storeFile = file(keystoreProperties.getProperty("storeFile") ?: "wika-release-key.jks")
                      storePassword = keystoreProperties.getProperty("storePassword") ?: "wika123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          """).strip()

          Path("android/app/build.gradle.kts").write_text(gradle_code)
          print("--- build.gradle.kts successfully written ---")
          PY

      - name: Setup Release Keystore
        working-directory: app/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > wika-release-key.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=wika-release-key.jks\n" "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" > key.properties
          echo "--- key.properties contents ---"
          cat key.properties

      - name: Show Release SHA-1
        working-directory: app/android
        run: |
          set -e
          echo "======================================"
          echo "WIKALIVE RELEASE SHA-1"
          echo "======================================"
          keytool -list -v -keystore wika-release-key.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} -alias ${{ secrets.KEY_ALIAS }}

      - name: Build Release APK
        working-directory: app
        run: |
          set -e
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
