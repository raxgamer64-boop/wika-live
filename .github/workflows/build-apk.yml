name: Build WikaLive Live UI Final

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true


      # ==========================================
      # 3. CREATE FLUTTER PROJECT
      # ==========================================
      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          rm -rf app

          flutter create \
            --org com.example \
            --project-name wika_live \
            app

          test -f main.dart || {
            echo "ERROR: Root main.dart is missing."
            exit 1
          }

          test -d assets/live_ui || {
            echo "ERROR: assets/live_ui folder is missing."
            exit 1
          }

          mkdir -p app/lib
          mkdir -p app/assets

          cp main.dart app/lib/main.dart
          cp -R assets/live_ui app/assets/live_ui

          echo "main.dart copied successfully."
          echo "live_ui assets copied successfully."

          find app/assets/live_ui -maxdepth 1 -type f -print


      # ==========================================
      # 4. PATCH ZEGO CONTROLLER API
      # ==========================================
      - name: Patch ZEGO controller API
        shell: bash
        run: |
          set -e

          FILE="app/lib/main.dart"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/lib/main.dart")
          text = path.read_text(encoding="utf-8")

          replacements = {
              ".turnCameraOn();": ".turnCameraOn();",
              ".turnCameraOff();": ".turnCameraOff();",
              ".turnMicrophoneOn();": ".turnMicrophoneOn();",
              ".turnMicrophoneOff();": ".turnMicrophoneOff();",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

          echo "ZEGO API patch step completed."


      # ==========================================
      # 5. FIREBASE
      # ==========================================
      - name: Configure Firebase
        shell: bash
        run: |
          set -e

          test -f google-services.json || {
            echo "ERROR: google-services.json is missing."
            exit 1
          }

          mkdir -p app/android/app
          cp google-services.json app/android/app/google-services.json

          echo "Firebase google-services.json copied."


      # ==========================================
      # 6. ANDROID PERMISSIONS
      # ==========================================
      - name: Configure Android permissions
        shell: bash
        run: |
          set -e

          MANIFEST="app/android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
          ]

          marker = '<application'

          additions = ""
          for permission in permissions:
              if permission not in text:
                  additions += f"    {permission}\n"

          if additions and marker in text:
              text = text.replace(marker, additions + "\n    " + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

          echo "Android permissions configured."


      # ==========================================
      # 7. GOOGLE SERVICES PLUGIN
      # ==========================================
      - name: Configure Google Services
        shell: bash
        run: |
          set -e

          GRADLE="app/android/settings.gradle.kts"

          if [ -f "$GRADLE" ]; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path("app/android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")

          line = 'id("com.google.gms.google-services") version "4.4.2" apply false'

          if line not in text:
              marker = 'plugins {'
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    " + line,
                      1
                  )

          path.write_text(text, encoding="utf-8")
          PY
          fi

          APP_GRADLE="app/android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          plugin = 'id("com.google.gms.google-services")'

          if plugin not in text:
              marker = 'plugins {'
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    " + plugin,
                      1
                  )

          path.write_text(text, encoding="utf-8")
          PY

          echo "Google Services plugin configured."


      # ==========================================
      # 8. ANDROIDX
      # ==========================================
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROPERTIES="app/android/gradle.properties"

          touch "$PROPERTIES"

          grep -q '^android.useAndroidX=true' "$PROPERTIES" || \
            echo 'android.useAndroidX=true' >> "$PROPERTIES"

          grep -q '^android.enableJetifier=true' "$PROPERTIES" || \
            echo 'android.enableJetifier=true' >> "$PROPERTIES"

          echo "AndroidX configured."


      # ==========================================
      # 9. ADD REQUIRED DEPENDENCIES
      # ==========================================
      - name: Configure Flutter dependencies
        shell: bash
        working-directory: app
        run: |
          set -e

          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add firebase_storage
          flutter pub add image_picker
          flutter pub add google_sign_in:7.2.0
          flutter pub add zego_uikit_prebuilt_live_streaming
          flutter pub add zego_uikit_signaling_plugin:2.8.21

          flutter pub get


      # ==========================================
      # 10. CONFIGURE LIVE UI ASSETS
      # ==========================================
      - name: Configure live UI assets
        shell: bash
        working-directory: app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")

          asset_line = "    - assets/live_ui/\n"

          if "    - assets/live_ui/" in text:
              print("assets/live_ui already configured.")
          else:
              lines = text.splitlines(True)

              flutter_indexes = []

              for i, line in enumerate(lines):
                  if re.match(r"^flutter:\s*$", line):
                      flutter_indexes.append(i)

              if not flutter_indexes:
                  raise SystemExit("ERROR: Root flutter: section not found.")

              idx = flutter_indexes[-1]

              insert_at = idx + 1

              while insert_at < len(lines):
                  line = lines[insert_at]

                  if line.strip() and not line.startswith(" "):
                      break

                  insert_at += 1

              block = [
                  "\n",
                  "  assets:\n",
                  asset_line,
              ]

              lines[insert_at:insert_at] = block

              path.write_text(
                  "".join(lines),
                  encoding="utf-8"
              )

          print("Final pubspec asset section:")
          print(path.read_text(encoding="utf-8"))
          PY

          flutter pub get


      # ==========================================
      # 11. VERIFY ASSETS
      # ==========================================
      - name: Verify live UI assets
        shell: bash
        run: |
          set -e

          test -f app/assets/live_ui/logo.png || {
            echo "ERROR: logo.png missing."
            exit 1
          }

          test -f app/assets/live_ui/ic_guardian_gold.png || {
            echo "ERROR: ic_guardian_gold.png missing."
            exit 1
          }

          echo "Live UI assets verified:"
          find app/assets/live_ui -maxdepth 1 -type f -printf '%f\n' | sort


      # ==========================================
      # 12. VERIFY FIREBASE PROJECT
      # ==========================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json

          with open("app/android/app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          project_id = (
              data
              .get("project_info", {})
              .get("project_id")
          )

          print("Firebase project:", project_id)

          if project_id != "wika-live":
              raise SystemExit(
                  f"ERROR: Expected Firebase project wika-live, got {project_id}"
              )
          PY


      # ==========================================
      # 13. RELEASE SIGNING SECRETS
      # ==========================================
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking signing secrets..."

          missing=0

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            missing=1
          fi

          if [ -z "$KEYSTORE_PASS" ]; then
            echo "ERROR: KEYSTORE_PASS is missing."
            missing=1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            missing=1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks

          test -s app/android/app/upload-keystore.jks || {
            echo "ERROR: Keystore file was not created."
            exit 1
          }

          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "Signing configuration created successfully."


      # ==========================================
      # 14. CONFIGURE GRADLE RELEASE SIGNING
      # ==========================================
      - name: Configure Gradle release signing
        shell: bash
        run: |
          set -e

          FILE="app/android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          signing_block = r'''
          import java.util.Properties
          import java.io.FileInputStream

          val keyPropertiesFile = rootProject.file("key.properties")
          val keyProperties = Properties()

          if (keyPropertiesFile.exists()) {
              keyProperties.load(FileInputStream(keyPropertiesFile))
          }

          '''

          if 'val keyPropertiesFile = rootProject.file("key.properties")' not in text:
              text = signing_block + text

          if 'signingConfigs {' not in text:
              marker = 'android {'

              signing = r'''
              signingConfigs {
                  create("release") {
                      if (keyPropertiesFile.exists()) {
                          storeFile = file(keyProperties["storeFile"] as String)
                          storePassword = keyProperties["storePassword"] as String
                          keyAlias = keyProperties["keyAlias"] as String
                          keyPassword = keyProperties["keyPassword"] as String
                      }
                  }
              }

              '''

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + signing,
                      1
                  )

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          if 'signingConfig = signingConfigs["release"]' not in text:
              text = text.replace(
                  'buildTypes {',
                  'buildTypes {',
                  1
              )

              release_marker = 'release {'

              pos = text.find(release_marker)

              if pos != -1:
                  close_insert = pos + len(release_marker)

                  text = (
                      text[:close_insert]
                      + '\n            signingConfig = signingConfigs.getByName("release")'
                      + text[close_insert:]
                  )

          path.write_text(text, encoding="utf-8")
          PY

          echo "Gradle signing configuration completed."


      # ==========================================
      # 15. FLUTTER ANALYZE
      # ==========================================
      # Analyzer info/warnings are NOT allowed to stop
      # the APK build. Real compiler/build errors below
      # will still fail the workflow.
      # ==========================================
      - name: Flutter analyze
        working-directory: app
        shell: bash
        run: |
          set +e

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

          ANALYZE_EXIT=$?

          echo ""
          echo "Flutter analyze exit code: $ANALYZE_EXIT"
          echo "Analyzer findings are not being used as the build gate."
          echo "The actual release build is the build gate."

          exit 0


      # ==========================================
      # 16. BUILD RELEASE APK
      # ==========================================
      - name: Build release APK
        working-directory: app
        shell: bash
        run: |
          set -e

          flutter build apk \
            --release

          test -f build/app/outputs/flutter-apk/app-release.apk || {
            echo "ERROR: Release APK was not generated."
            exit 1
          }

          echo "Release APK generated successfully."


      # ==========================================
      # 17. BUILD RELEASE AAB
      # ==========================================
      - name: Build release AAB
        working-directory: app
        shell: bash
        run: |
          set -e

          flutter build appbundle \
            --release

          test -f build/app/outputs/bundle/release/app-release.aab || {
            echo "ERROR: Release AAB was not generated."
            exit 1
          }

          echo "Release AAB generated successfully."


      # ==========================================
      # 18. VERIFY APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"


      # ==========================================
      # 19. VERIFY AAB
      # ==========================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="app/build/app/outputs/bundle/release/app-release.aab"

          test -f "$AAB"

          echo "AAB:"
          ls -lh "$AAB"

          echo "AAB SHA256:"
          sha256sum "$AAB"


      # ==========================================
      # 20. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


      # ==========================================
      # 21. UPLOAD AAB
      # ==========================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WikaLive-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      # ==========================================
      # 22. FINAL STATUS
      # ==========================================
      - name: Build completed
        shell: bash
        run: |
          echo "=========================================="
          echo "WikaLive BUILD COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo ""
          echo "APK:"
          echo "app/build/app/outputs/flutter-apk/app-release.apk"
          echo ""
          echo "AAB:"
          echo "app/build/app/outputs/bundle/release/app-release.aab"
          echo ""
          echo "GitHub Actions artifacts:"
          echo "- WikaLive-release-apk"
          echo "- WikaLive-release-aab"
          echo "=========================================="
